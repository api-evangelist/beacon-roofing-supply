specification: API Commons Error Catalog
specificationVersion: '0.1'
provider: Beacon Roofing Supply
providerId: beacon-roofing-supply
name: Beacon Rest Services Error / Message Code Registry
description: >-
  Beacon publishes a numeric application-level message-code registry inside the info.description of
  every Beacon Rest Services OpenAPI. The code is returned in the messages[] array of the uniform
  response envelope alongside the HTTP status, so a caller must read both: the HTTP status describes
  the transport outcome and the numeric code describes the business outcome. Codes are grouped by
  leading digit into five classes.
format: vendor-numeric
rfc9457: false
envelope:
  shape: |-
    {
      "success": false,
      "messages": [ { "key": null, "code": "1001", "type": "error", "value": "Validation exception" } ],
      "result": null
    }
  fields:
    - name: success
      description: Boolean outcome flag. false indicates the call did not succeed.
    - name: messages
      description: Array of message objects; each carries key, code, type and value.
    - name: messages[].code
      description: The numeric message code from the registry below.
    - name: messages[].type
      description: 'One of: success | error.'
    - name: messages[].value
      description: Human-readable message text.
    - name: result
      description: The operation payload on success; null or absent on error.
    - name: traceId
      description: >-
        Per-request correlation id returned on error responses. Observed on a live unauthenticated
        probe 2026-09-04 (GET https://beaconproplus.com/v3/rest/com/becn/branchData -> 401 with
        traceId "cb065aa5056b615d1e0907a0d4788d9e"). Not documented in the spec; use it when opening
        a support ticket.
    - name: messageCode
      description: >-
        Alternate top-level field used by some V3 responses in place of messages[].code
        (observed live: {"result":null,"message":"Please provide token","messageCode":401}).
  note: >-
    Beacon documents that a named list of V2 operations does NOT use this envelope and returns the
    example payload directly. Those legacy-format operations are listed under legacy_envelope_operations.
legacy_envelope_operations:
  - /quote
  - /getQuoteDetail
  - /getCurrentUserInfo
  - /getAddressBook
  - /createAddressBook
  - /updateAddressBook
  - /deleteAddressBook
  - /changePassword
