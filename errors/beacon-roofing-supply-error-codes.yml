method: searched
source: >-
  https://beaconproplus.com/swagger/static/swagger-ui-url/go-live/v2.yaml (the "API Response Message
  Code" table published verbatim inside info.description of the Beacon Rest Services Ver 2 (OAuth)
  OpenAPI, rendered at https://beaconproplus.com/swagger/v2/), plus the OAuth token-service message
