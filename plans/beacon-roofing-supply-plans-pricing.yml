source: >-
  https://www.qxo.com/customapi (the "QXO API services" page, HTTP 200 probed 2026-09-04),
  https://go.qxo.com/qxoapi (the API access request form, HTTP 200) and
  https://www.qxo.com/integrations/api-license-terms (the published API license terms)
tags:
  - Construction
  - Distribution
  - Roofing
  - Building Materials
  - E-Commerce
description: >-
  QXO (which acquired Beacon Roofing Supply in April 2025) publishes NO plans, tiers, price points or
  quotas for the Beacon PRO+ / QXO APIs. plan_count is 0 and that is a searched finding, not an
  unchecked one. The developer page at https://www.qxo.com/customapi lists six named API products
  (Order, Pricing, Account, Product, Delivery Tracking, Invoice) and ends in a single "Contact us"
  call to action. The request form at https://go.qxo.com/qxoapi states the only two gates that
  exist: you must already be a QXO.com customer (register at https://www.qxo.com/open-an-account),
  and you must accept the API license terms. Nothing is priced; API access is an attribute of the
  commercial account relationship, and the money changes hands on the material order, not on the API
  call.
gate: sales
gate_url: https://go.qxo.com/qxoapi
terms_url: https://www.qxo.com/integrations/api-license-terms
liability_cap: >-
  The published API license terms cap QXO's maximum aggregate liability at USD 100 — the only dollar
  figure attached to the API programme anywhere on the public surface.
published_api_products:
  - name: Order API
    description: Place material orders and track order status and deliveries within your system.
  - name: Pricing API
    description: >-
      Access real-time pricing information for single or multiple QXO products to simplify generating
      estimates and placing orders.
  - name: Account API
    description: >-
      Access customer account information including billing addresses, contacts and other account
      details.
  - name: Product API
    description: >-
      Browse the QXO product catalog for product details, availability and key attributes across
      multiple product hierarchies.
  - name: Delivery Tracking API
    description: Track material order status; delivery photos are delivered to the customer's inbox.
  - name: Invoice API
    description: Access invoices, invoiced data, payment status and other financial information.
notes: >-
  The six product names above are QXO's own marketing decomposition of the API programme and do not
  map one-to-one onto the eleven published OpenAPI documents, which are versioned by release train
  (V1/V2/V3/Public/OAuth2/Internal) rather than by product. Both are recorded because a buyer reads
  the first and an integrator reads the second.
sources:
  - https://beaconproplus.com/swagger/all_api/
  - https://beaconproplus.com
plans: []
plans_removed_note: >-
  A previous bulk sweep (2026-05-04, method: generated) asserted a single "Beacon PRO+ Account"
  enterprise plan with three priced entries. Nothing on QXO's public surface publishes those terms,
  so the entry has been removed rather than re-stated: plan_count is 0 and the list is empty. The
  capability list that entry carried is preserved as published_api_products above, which QXO does
  publish.

