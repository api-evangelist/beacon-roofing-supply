ownership:
  status: acquired
  acquirer: QXO, Inc.
  completed: '2025-04-29'
  effect_on_api: >-
    The Beacon PRO+ consumer web app has been folded into www.qxo.com — beaconproplus.com and
    becn.com now 301 to qxo.com, and the PRO+ login lives at https://www.qxo.com/proplus/login. The
    API itself did NOT move: the Swagger index, the eleven OpenAPI documents and the /v1|/v2|/v3
    REST bases all still serve from beaconproplus.com and were live when probed 2026-09-04. The
    developer-facing marketing surface has moved to https://www.qxo.com/customapi while the technical
    surface stayed behind, which is why the two are easy to miss from each other.
