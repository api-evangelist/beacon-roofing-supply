      - type: OpenAPI
        url: openapi/beacon-roofing-supply-v2-ng-openapi.yml
      - type: Overlay
        url: overlays/beacon-roofing-supply-v2-overlay.yaml
  - aid: beacon-roofing-supply:beacon-rest-all-api
    name: Beacon External Rest Service (all_api)
    description: >-
      The combined Beacon Rest Services document — 145 operations spanning the V1, V2, V3 and V4
      tags plus the Integrations and Beacon Stack surfaces. It is the ONLY Beacon document that
      assigns operationIds (V1Controller_*, V2Controller_*, V3Controller_*, V4Controller_*), which
      makes it the document any SDK generator, tool crosswalk or workflow definition has to bind to.
      It also carries the API Site ID resolution rules, the uniform response envelope, the numeric
      message-code registry and the field glossary inside its info.description.
    humanURL: https://beaconproplus.com/swagger/all_api/
    baseURL: https://beaconproplus.com
