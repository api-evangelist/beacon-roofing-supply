  - aid: beacon-roofing-supply:beacon-rest-v1
    name: Beacon Rest Services V1 (session)
    description: >-
      The original Beacon PRO+ API surface — login and logout, account switching, branch list, jobs,
      order history and detail, catalog item lookup, pricing, cart items, order submission and
      templates. Nineteen published operations. Authenticated with a browser-shaped cookie session
      (JSESSIONID, DYN_USER_ID, DYN_USER_CONFIRM, siteId) established by POST /login and lasting one
      hour, or seven days with the RememberMe flag, rather than with a bearer token.
