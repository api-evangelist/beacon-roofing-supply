  - aid: beacon-roofing-supply:beacon-rest-v3
    name: Beacon Rest Services V3 (Public / Integrations)
    description: >-
      Beacon's integration surface — bulk catalog, SKU, branch and product-availability extracts
      designed for ERP, PIM and estimating-system synchronisation, plus the Mincron ERP product
      mapping endpoint and account deletion. Eight published operations, authenticated with an
      OAuth 2.0 bearer token despite the "Public" label. This is the correct surface for a full
      catalog sync; paging the search endpoints to reconstruct the catalog is not.
    humanURL: https://beaconproplus.com/swagger/v3/
