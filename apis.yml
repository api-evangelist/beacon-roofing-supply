aid: beacon-roofing-supply
url: >-
  https://raw.githubusercontent.com/api-evangelist/beacon-roofing-supply/refs/heads/main/apis.yml
name: Beacon Roofing Supply
description: >-
  Beacon Roofing Supply (formerly NASDAQ: BECN) is one of the largest distributors of residential and
  non-residential roofing materials and complementary building products in North America, operating
  roughly 600 branches. QXO, Inc. completed its acquisition of Beacon on 2025-04-29 and the business
  now trades under the QXO brand. Its contractor commerce platform, Beacon PRO+, publishes an
  unusually complete REST surface: eleven OpenAPI 3.0 documents totalling 424 operations, indexed at
  https://beaconproplus.com/swagger/ and covering catalog search, account-specific real-time pricing,
  branch availability, cart and order submission, quotes and approval workflows, order history,
  delivery tracking, invoices, manufacturer rebates, permission management and the EagleView, GAF
  QuickMeasure and Hover measurement integrations, plus an OAuth 2.0 token service and a change log
  covering 72 releases. Access is sales-gated at https://www.qxo.com/customapi; contracts are public.
