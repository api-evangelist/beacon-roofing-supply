apis:
  - aid: beacon-roofing-supply:beacon-pro-plus
    name: Beacon PRO+ API (V2, OAuth)
    description: >-
      The primary Beacon Rest Services surface — 187 published operations covering the product
      catalog, account-specific real-time pricing, branch and region availability, cart and order
      submission, quotes and saved-order approval workflows, order history, delivery tracking,
      invoices (Bill Trust), manufacturer rebates, permission templates, and the EagleView, GAF
      QuickMeasure and Hover measurement-partner integrations. Authenticated with an OAuth 2.0
      bearer token. This is the surface QXO markets as its Order, Pricing, Account, Product,
      Delivery Tracking and Invoice APIs.
    humanURL: https://beaconproplus.com/swagger/v2/
    baseURL: https://beaconproplus.com/v2/rest/com/becn
