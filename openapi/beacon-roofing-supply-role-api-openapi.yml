  version: '1.0'
  contact: {}
servers: []
tags:
- name: Role
paths:
  /role:
    get:
      operationId: V2Controller_role
      summary: Returns role and permissions for current user
      description: Returns the assigned role for current user and whether user is allowed to approve orders, view pricing, place orders, view order history, manage quotes or manage rebates.
      parameters: []
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/roleResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - Role
components:
  schemas:
    roleResponse:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission2'
      required:
      - id
      - displayName
      - permissions
    Permission2:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        isGroup:
          type: boolean
      required:
      - name
      - type
      - permissions
      - isGroup
    Permission:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        groupId:
          type: string
        name:
          type: string
        displayName:
          type: string
        type:
          type: string
        isAuthorised:
          type: boolean
        isDisabled:
          type: boolean
        isFixed:
          type: boolean
      required:
      - id
      - key
      - groupId
      - name
      - displayName
      - type
      - isAuthorised
      - isDisabled
      - isFixed
