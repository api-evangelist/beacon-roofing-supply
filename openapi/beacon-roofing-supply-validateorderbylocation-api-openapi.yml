tags:
- name: ValidateOrderByLocation
paths:
  /validateOrderByLocation:
    get:
      operationId: V2Controller_validateOrderByLocation
      summary: Validates inventory at pick up location
      description: Validates inventory at pick up location.
      parameters:
      - name: orderId
        required: true
        in: path
        description: ATG Order Id, or Saved Order Id, or Quote Order Id
        schema:
          type: string
      - name: branchId
        required: false
        in: path
        description: Branch legacy id
        schema:
          type: string
      - name: address
        required: false
        in: path
        description: Branch address2
        schema:
          type: string
      - name: postCode
        required: false
        in: path
        description: Branch address postCode
        schema:
          type: string
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - ValidateOrderByLocation
