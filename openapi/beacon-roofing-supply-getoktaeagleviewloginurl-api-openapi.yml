paths:
  /getOktaEagleViewLoginUrl:
    get:
      operationId: V2Controller_getOktaEagleViewLoginUrl
      summary: Generates current user okta eagle view redirect URL
      description: Returns okta eagle view redirect URL to link Beacon PRO+ to Eagleview account to log on.
      parameters: []
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getOktaEagleViewLoginUrlResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - GetOktaEagleViewLoginUrl
components:
  schemas:
    getOktaEagleViewLoginUrlResponse:
      type: object
      properties:
        oktaLoginLink:
          type: string
      required:
      - oktaLoginLink
