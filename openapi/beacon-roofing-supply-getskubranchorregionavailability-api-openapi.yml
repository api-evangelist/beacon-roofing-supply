tags:
- name: GetSKUBranchOrRegionAvailability
paths:
  /getSKUBranchOrRegionAvailability:
    get:
      operationId: V2Controller_getSKUBranchOrRegionAvailability
      summary: Returns product availability for a branch
      description: Returns availability within a branch in a market for a specific sku Id. If it is not available at a specific branch but is available at a different branch within that market, the response will show available at the region but not at the branch.
      parameters:
      - name: skuIds
        required: false
        in: path
        description: Sku Ids separated by comma
        schema:
          type: string
      - name: branchId
        required: false
        in: path
        description: Branch legacy number
        schema:
          type: string
      - name: regionId
        required: false
        in: path
        description: Region legacy number
        schema:
          type: string
      - name: marketId
        required: false
        in: path
        description: Market Id
        schema:
          type: string
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getSKUBranchOrRegionAvailabilityResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - GetSKUBranchOrRegionAvailability
