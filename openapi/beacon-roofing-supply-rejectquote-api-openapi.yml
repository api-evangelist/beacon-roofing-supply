  version: '1.0'
  contact: {}
servers: []
tags:
- name: RejectQuote
paths:
  /rejectQuote:
    post:
      operationId: V2Controller_rejectQuote
      summary: Rejects quote
      description: Allows approver to reject quote and provide reason for rejection. If quote Id is invalid, empty or quote status is not in ready for review status, will result in an error message. If quote Id is valid and status is in ready to review, quote will be rejected, reason provided, and email sent to quote of submitter with updates.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/rejectQuoteBody'
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - RejectQuote
components:
  schemas:
    rejectQuoteBody:
      type: object
      properties:
        quoteId:
          type: string
        reason:
          type: string
      required:
      - quoteId
      - reason
