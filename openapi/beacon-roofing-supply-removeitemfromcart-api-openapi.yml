paths:
  /removeItemFromCart:
    post:
      operationId: V2Controller_removeItemFromCart
      summary: Removes a single item from cart
      description: Removes a single item from cart using the "commerceItemId" unique Id.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/removeItemFromCartBody'
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - RemoveItemFromCart
components:
  schemas:
    removeItemFromCartBody:
      type: object
      properties:
        commerceItemId:
          type: string
      required:
      - commerceItemId
