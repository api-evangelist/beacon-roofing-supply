  version: '1.0'
  contact: {}
servers: []
tags:
- name: DownloadBeacon3DplusApp
paths:
  /downloadBeacon3DplusApp:
    get:
      operationId: V2Controller_downloadBeacon3DplusApp
      summary: Sends SMS to end user
      description: Sends SMS to end user with a link to download Hover application.
      parameters:
      - name: phoneNumber
        required: true
        in: path
        description: Phone number
        schema:
          type: string
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - DownloadBeacon3DplusApp
