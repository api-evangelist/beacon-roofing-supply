tags:
- name: GetPermissionTemplateDetail
paths:
  /getPermissionTemplateDetail:
    post:
      operationId: V2Controller_getPermissionTemplateDetail
      summary: Returns details for permissions templates
      description: Returns details of permissions templates for custom permissions created by the Admin or Master Admin.
      parameters:
      - name: templateId
        required: false
        in: path
        description: Permission Template Id
        schema:
          type: string
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getPermissionTemplateDetailResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - GetPermissionTemplateDetail
