  /invoice:
    get:
      tags:
        - Invoiced Services
      summary: List invoiced Data under the account
      description: |
        This service will list the invoiced Data
      parameters:
        - in: query
          name: accountId
          description: Account ID
          required: true
          schema:
            type: string
        - in: query
          name: company
          description: Company Number
          required: true
          schema:
            type: string
        - in: query
          name: branchNumber
          description: Branch number
          required: true
          schema:
            type: string
        - in: query
          name: pageSize
          description: Default page size is 25, max 100
          schema:
            type: integer
        - in: query
          name: pageNo
          description: Default page no is 1
          schema:
            type: integer
        - in: query
          name: searchBy
          schema:
            type: string
          description: |
            searchBy enumeration
            * OrderPlacedDate
            * OrderNumber
            * OrderStatus
            * UUID
            * OrderId
        - in: query
          name: searchTerm
          schema:
            type: string
          description: |
            When 'searchBy' is one of the following enumeration, the 'searchTerm' should be populated
            * OrderNumber
            * UUID
            * OrderId
        - in: query
          name: searchStartDate
          schema:
            type: string
            format: MM-DD-YYYY
          description: |
            When 'searchBy' is 'OrderPlacedDate', the 'searchStartDate' should be populated, format should be 'MM-DD-YYYY', e.g. '01-05-2021',the searchStartDate limit  to the past year.
        - in: query
          name: searchEndDate
          schema:
            type: string
            format: MM-DD-YYYY
          description: |
            When 'searchBy' is 'OrderPlacedDate', the 'searchEndDate' should be populated, format should be 'MM-DD-YYYY', e.g. '01-05-2021'
        - in: query
          name: searchEnum
          schema:
            type: string
          description: |
            When 'searchBy' is 'OrderStatus', the 'searchEnum' should be one of the following enumeration:
            * Delivered
            * Invoiced
            * Pending
            * Processing
            * ReadyDeliveryOrPickUp
            * DeliveredOrInvoiced
        - in: query
          name: queryCompany
          description: Default queryCompany is true
          schema:
            type: boolean
      responses:
        '200':
          description: |
            successful operation
            refer to *API Uniform Format*
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orderInvoiceRep'
        '400':
          description: 'Bad Request, accountId is invalid'
        '401':
          description: 'Unauthorized, the authorization bearer token is invalid'
        '403':
          description: 'Forbidden, user do not has permission to access this API'
        '405':
          description: 'Method not allowed, the request method is not valid for this API or this API is not available.'
        '419':
          description: 'Unauthorized, the authorization bearer token is expired'
        '500':
          description: Internal exception

  /saveEagleViewOrderBilling:
    post:
      tags:
        - Eagle View Order
      summary: Store EV order bill data
      description: |
        Available Status
         * Created
         * InProcess
         * Pending
         * Closed
         * Completed
        
        Available ProductType
         * `1` - PremiumResidential
         * `2` - PremiumCommercial
         * `3` - StandardResidential
         * `9` - Images
         * `10` - ParkingLot
         * `11` - EagleView Inform Essentials+
         * `12` - EagleView Inform Essentials+ for Commercial
         * `13` - ClaimsReadyResidential
         * `14` - ClaimsReadyCommercial
         * `15` - AA2D
         * `16` - AA3DResidential
         * `17` - SketchOnly
         * `18` - AA3DCommercial
         * `20` - InstallerReport
         * `25` - EC3DResidential
         * `26` - EC3DCommercial
         * `27` - EC2DResidential
         * `28` - EC2DCommercial
         * `29` - PremiumAWResidential
         * `30` - PremiumAWCommercial
         * `31` - ECPremiumResidential
         * `32` - ECPremiumCommercial
         * `34` - PremiumResidentialWallonly
         * `35` - PremiumCommercialWallonly
         * `37` - RiskManagementResidential
         * `38` - RiskManagementCommercial
         * `39` - Estimate
         * `40` - RoofGeometryResidential
         * `41` - CarrierEstimate
         * `44` - QuickSquares
         * `46` - GutterResidential
         * `47` - GutterCommercial
         * `48` - DiagramResidential
         * `49` - DiagramCommercial
         * `51` - WallsLite
         * `55` - QuickSquares-Multi-Family
         * `62` - EagleView Inform Advanced
         * `63` - EagleView Inform Advanced for Commercial
         * `84` - Bid Perfect
         * `85` - Walls, Windows, & Doors
         * `86` - Walls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/saveEagleViewOrderBilling_req'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/saveEagleViewOrderBilling_res'
        '401':
          description: 'Unauthorized, the authorization token is invalid'
        '405':
          description: 'Method not allowed, the request method is not valid for this API or this API is not available.'
        '500':
          description: Internal exception
