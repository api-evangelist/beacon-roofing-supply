info:
  title: Beacon Rest Services
  description: |-
    A combination of all methods in the beacon-api
    <p>[ BASE URL: <i>https://beaconproplus.com</i></p>
    <h5>Beacon ProPlus</h5>
    Version 1: https://beaconproplus.com/v1/rest/com/becn

    Version 2: https://beaconproplus.com/v2/rest/com/becn 

    Version 3: https://beaconproplus.com/v3/rest/com/becn <br>

    <h5>Beacon Stack</h5>
    <p>[ BASE URL: https://beacon-api-x7xzzdp35a-uk.a.run.app</p>
    Version 1: https://beacon-api-x7xzzdp35a-uk.a.run.app/v1/rest/com/becn/

    Version 2: https://beacon-api-x7xzzdp35a-uk.a.run.app/v2/rest/com/becn/

    Version 3: https://beacon-api-x7xzzdp35a-uk.a.run.app/v3/rest/com/becn/

    <br><h3>API Site ID</h3><details>    <summary>Show...</summary>    <p>Most of the APIs supports the <code>apiSiteId</code> parameter in the following locations, the parsing priority is higher to lower.    For example, if this parameter appears both in request parameter and request body, will get the one in the request    parameter, any other locations will be ignored.</p>    <ol>        <li>            <p><code>apiSiteId</code> in Request Parameter/URL/Query String e.g.</p>            <p>                <code>example.com/?apiSiteId=XYZ...</code>                <br><code>example.com/?...&apiSiteId=XYZ...</code>            </p>        </li>        <li>            <p><code>apiSiteId</code> in Request Body/Payload e.g.</p>            <p><code>                    {                        ...                        "apiSiteId": "XYZ",                        ...                    }            </code></p>            <p>                Please be noted, only support when <code>apiSiteId</code> is the root element of request body. For example, the                 <code>apiSiteId</code> in the following request body is the second element, so this property will be ignored:            </p>            <p><code>                {                    ...                    "foo": {                        "apiSiteId": "XYZ",                    }                    ...                }            </code></p>        </li>        <li>            <p><code>apiSiteId</code> related OAuth Token in Request Header e.g.</p>            <p><code>Authorization Bearer atdy9au5qtg0ofkxdewwr3169...</code></p>            <p>In this case, the <code>apiSiteId</code> will be parsed via the OAuth Token. For example, if one token is generated by the client id            "nigu0zjtyih7lb36l2...", then this client related api site id(pre-defined and stored in the server database) will be the            value of <code>apiSiteId</code></p>        </li>    </ol></details><br><h3>API Uniform Format</h3><details>    <summary>Show...</summary>    <h4>Response</h4>    <code>        {            "success":true,            "messages":[                {                    "key":null,                    "code":null,                    "type":"success",                    "value":""                }            ],            "result": <the response example value of each API>        }    </code>    <h4>Explanation</h4>    <p>If the response example value of one endpoint <code>/foo</code> is:</p>    <code>        {            "name":"bar",            "age":123        }    </code>    <p>Then the actual response value of this endpoint is: (replace the value of "result" element in <code>API Uniform Format</code> with example response)</p>    <code>        {            "success":true,            "messages":[                {                    "code":null,                    "type":"success",                    "value":""                }            ],                "result":{                "name":"bar",                "age":123            }        }    </code></details><br><h3>API Response Message Code</h3><details>    <summary style="color:#4990e2;">Show...</summary>    <table id="API_Response_Message_Code" border="1">        <tbody>            <tr>                <th colspan="1" align="center" width="20%">                    <p><span>Code Group</span></p>                </th>                <th align="center" width="10%">                    <p><span>Code</span></p>                </th>                <th align="left" width="40%">                    <p><span>Comments</span></p>                </th>            </tr>            <tr>                <td rowspan="8" align="left" width="20%">1XXX: <br>common request param error</td>                <td align="center" width="10%">1001</td>                <td align="left" width="40%">Param is required.</td>            </tr>            <tr>                <td align="center" width="10%">1002</td>                <td align="left" width="40%">Repository item not found via request</td>            </tr>            <tr>                <td align="center" width="10%">1003</td>                <td align="left" width="40%">Param max length is invalid.</td>            </tr>            <tr>                <td align="center" width="10%">1004</td>                <td align="left" width="40%">Param min length is invalid.</td>            </tr>            <tr>                <td align="center" width="10%">1005</td>                <td align="left" width="40%">Param regular expression is invalid.</td>            </tr>            <tr>                <td align="center" width="10%">1006</td>                <td align="left" width="40%">Request param requestBody is not a valid</td>            </tr>            <tr>                <td align="center" width="10%">1007</td>                <td align="left" width="40%">Request param caused validation exception</td>            </tr>            <tr>                <td align="center" width="10%">1008</td>                <td align="left" width="40%">Request param caused form error</td>            </tr>            <tr>                <td rowspan="6" align="left" width="20%">2XXX: <br>current profile error</td>                <td align="center" width="10%">2001</td>                <td align="left" width="40%">Current profile in request is empty</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">2002</td>                <td colspan="1" align="left" width="40%">Current profile type/instance in request is empty</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">2003</td>                <td colspan="1" align="left" width="40%">Current profile in request do not have available accounts</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">2004</td>                <td colspan="1" align="left" width="40%">Current profile is unauthorized</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">2005</td>                <td colspan="1" align="left" width="40%">Current profile is already authorized</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">2006</td>                <td colspan="1" align="left" width="40%">Current profile is permission denied</td>            </tr>            <tr>                <td rowspan="7" align="left" width="20%">3XXX: <br>specified request param error</td>                <td colspan="1" align="center" width="10%">3001</td>                <td colspan="1" align="left" width="40%">Request param account id is not available/not belong to current                    profile</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">3002</td>                <td colspan="1" align="left" width="40%">Request param product id is not available to current region of                    current profile</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">3003</td>                <td colspan="1" align="left" width="40%">Request param profile id is not equal to current profile</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">3004</td>                <td colspan="1" align="left" width="40%">Request param profile id is not found</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">3005</td>                <td colspan="1" align="left" width="40%">Request param site id is not equal to current site</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">3006</td>                <td colspan="1" align="left" width="40%">Request param sku id is not available to current region of current                    profile</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">3007</td>                <td colspan="1" align="left" width="40%">Request param shipping is invalid to current region of current                    profile</td>            </tr>            <tr>                <td rowspan="3" align="left" width="20%">4XXX: <br>system level common error</td>                <td colspan="1" align="center" width="10%">4001</td>                <td colspan="1" align="left" width="40%">System error</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">4002</td>                <td colspan="1" align="left" width="40%">Mincron error</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">4003</td>                <td colspan="1" align="left" width="40%">ATG Order version invalid error</td>            </tr>            <tr>                <td rowspan="11" align="left" width="20%">5XXX: <br>specified response error</td>                <td colspan="1" align="center" width="10%">5001</td>                <td colspan="1" align="left" width="40%">Submit order failed response</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">5002</td>                <td colspan="1" align="left" width="40%">Submit order failed with integration exception message returned                </td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">5003</td>                <td colspan="1" align="left" width="40%">Query order detail not match with current</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">5004</td>                <td colspan="1" align="left" width="40%">No result is returned to order history</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">5005</td>                <td colspan="1" align="left" width="40%">Template name invalid</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">5006</td>                <td colspan="1" align="left" width="40%">Need change account</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">5007</td>                <td colspan="1" align="left" width="40%">Account no longer available for current user</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">5008</td>                <td colspan="1" align="left" width="40%">Illegal data</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">5009</td>                <td colspan="1" align="left" width="40%">Account token invalid</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">5010</td>                <td colspan="1" align="left" width="40%">No current Order</td>            </tr>            <tr>                <td colspan="1" align="center" width="10%">5011</td>                <td colspan="1" align="left" width="40%">Quote order account not match</td>            </tr>        </tbody>    </table></details><br><h3>Glossary</h3><details>  <summary style="color: #4990e2">Show...</summary>  <table id="API_Glossary" border="1">    <thead>      <tr>        <td>Value</td>        <td>Data Type</td>        <td>Example</td>        <td>Description</td>      </tr>    </thead>    <tbody>      <tr>        <td>account</td>        <td>"string"</td>        <td>"280381"</td>        <td>          6 digit numerical value assigned to a Beacon customer also known as accountLegacyId or accountId.        </td>      </tr>      <tr>        <td>accountId</td>        <td>"string"</td>        <td>"280381"</td>        <td>          6 digit numerical value assigned to an account assigned to a Beacon customer also known as accountLegacyId or account.        </td>      </tr>      <tr>        <td>accountLegacyId</td>        <td>"string"</td>        <td>"280381"</td>        <td>          6 digit numerical value assigned to an account assigned to a Beacon customer also known as accountId or account.        </td>      </tr>      <tr>        <td>address1</td>        <td>"string"</td>        <td>"3000 BRIGHTON BLVD"</td>        <td>Ship to address field.</td>      </tr>      <tr>        <td>address2</td>        <td>"string"</td>        <td>"Lot 11, Subdivision 2"</td>        <td>Additional ship to address field.</td>      </tr>      <tr>        <td>apiSiteId</td>        <td>"string"</td>        <td>"DEN"</td>        <td>          Specific value assigned to customer account to identify source of API traffic.        </td>      </tr>      <tr>        <td>atgOrderId</td>        <td>"string"</td>        <td>"KP32234"</td>        <td>Order number as it appears on PRO+.</td>      </tr>      <tr>        <td>atgUUID</td>        <td>"string"</td>        <td>"41cf3908-fe11-45ce-899c-9390c8299a18"</td>        <td>          Unique identifier assigned by customer in GUID format and is same as UUID.        </td>      </tr>      <tr>        <td>branchNumber</td>        <td>"string"</td>        <td>"800"</td>        <td>          The store number of the Beacon branch assigned to a customer based on customer location.        </td>      </tr>      <tr>        <td>checkForAvailability</td>        <td>"string"</td>        <td>"No", "Yes"</td>        <td>          The “checkForAvailability” field should always be “No” to ensure          orders are received by a branch representative. If “Yes,” and the          product is not available at time of order, the order will be          cancelled.        </td>      </tr>      <tr>        <td>description</td>        <td>"string"</td>        <td>“GAF 13-1/4" x 39-3/8" Timber”</td>        <td>          Optional product description. If no item number, description is          required.        </td>      </tr>      <tr>        <td>dtAccount</td>        <td>Object</td>        <td>"Text", "Email", "Text&Email"</td>        <td>          The deliveryTrackingSettings of current user with last selected          account. If dtAccount is enabled, user will be notified by email once          order has been requested, scheduled and/or delivered.        </td>      </tr>      <tr>        <td>itemNumber</td>        <td>"string"</td>        <td>"560193"</td>        <td>          Unique identifier assigned to individual product items.           Where a product has variations, such as color, each variation will have its own itemNumber. Same as skuId.        </td>      </tr>      <tr>        <td>jobName</td>        <td>"string"</td>        <td>"Middleton Hilltop"</td>        <td>          Job name can be added to a purchase order to tie order to specific job site or project.        </td>      </tr>      <tr>        <td>jobNumber</td>        <td>"string"</td>        <td>"999"</td>        <td>          Account holder can require jobNumber for each order processed within          that account. Use get/jobs service to see if jobNumber is required for          account.        </td>      </tr>      <tr>        <td>onHold</td>        <td>Boolean</td>        <td>"False"</td>        <td>          If delivery date is unknown, customer can use onHold option to reserve          material for a later delivery date. If onHold is true, order will          deliver in pending state to branch with the branch’s default shipping          date set in the future. Branch will work with customer to finalize          delivery date.        </td>      </tr>      <tr>        <td>Ordered</td>        <td>"string"</td>        <td>"27/10/2021 00:00:00"</td>        <td>Date order was placed in YYYY-MM-DD format.</td>      </tr>      <tr>        <td>orderId</td>        <td>"string"</td>        <td>"JQ20785"</td>        <td>          Unique alphanumerical order number and is the same as orderNumber and OrderNo.        </td>      </tr>      <tr>        <td>orderNo</td>        <td>"string"</td>        <td>"JQ20785"</td>        <td>          Unique alphanumerical order number and is the same as orderId and orderNo.        </td>      </tr>      <tr>        <td>orderNumber</td>        <td>"string"</td>        <td>"JQ20785"</td>        <td>          Unique alphanumerical order number and is the same as orderId and orderNo.        </td>      </tr>      <tr>        <td>orderPlacedDate</td>        <td>"string"</td>        <td>"27/10/2021 00:00:00"</td>        <td>Date the order was placed in YYYY-MM-DD format.</td>      </tr>      <tr>        <td>OrderStatusCode</td>        <td>"string"</td>        <td>"N"</td>        <td>          All orders should be sent in pending state “N.” Order status codes          include (I) Invoiced, (R) Reviewed, (P) Priced, (C) Changed, (O) Open,          (K) Reserved, (N) Pending.        </td>      </tr>      <tr>        <td>password</td>        <td>"string"</td>        <td>"Passw0rd"</td>        <td>          Password needs to have more than 7 characters, have 1 uppercase, 1 lowercase and 1 number.        </td>      </tr>      <tr>        <td>persistentLoginType</td>        <td>"string"</td>        <td>"RememberMe"</td>        <td>          Use persistent login type to extend live session to seven days. Default session time lasts 1 hour.        </td>      </tr>      <tr>        <td>pickupDate</td>        <td>"string"</td>        <td>"2023-22-12"</td>        <td>The date you would like product delivered.</td>      </tr>      <tr>        <td>pickupTime</td>        <td>"string"</td>        <td>"Afternoon"</td>        <td>          Recommended values: "Morning", "Afternoon", "Anytime", "Special Request".        </td>      </tr>      <tr>        <td>productId</td>        <td>"string"</td>        <td>"TRIG1143RPFMF"</td>        <td>          Product identifier. Can designate an individual product or a family (parent + children items) of products.        </td>      </tr>      <tr>        <td>productImage</td>        <td>"string"</td>        <td>"/images/large/C-635001_default_small.jpg"</td>        <td>          Product image visible when appended with          https://beaconproplus.com/images/large/C-635001_default_small.jpg.        </td>      </tr>      <tr>        <td>profileId</td>        <td>"string"</td>        <td>"user318510004"</td>        <td>          This value is used to retrieve account information for current user.          The profileId can be pulled from the Getcurrentuserinfo service.        </td>      </tr>      <tr>        <td>purchaseOrderNo</td>        <td>"string"</td>        <td>"108303"</td>        <td>          A value assigned by customer that does not need to be unique.        </td>      </tr>      <tr>        <td>quoteOrderId</td>        <td>"string"</td>        <td>"7740531"</td>        <td>          tePermanent Id assigned to quote once received in Mincron and returned          for review.st        </td>      </tr>      <tr>        <td>roleType</td>        <td>"string"</td>        <td>"Admin"</td>        <td>The roleType is either "Master Admin","Admin", or "Site User".</td>      </tr>      <tr>        <td>shippingMethod</td>        <td>"string"</td>        <td>"O"</td>        <td>          Delivery or pickup method where “O” is for delivery and “P” is for pick up. If “P”, shipping address is not required.        </td>      </tr>      <tr>        <td>siteId</td>        <td>"string"</td>        <td>"homeSite"</td>        <td>SiteId is used for log in requests and should be set to homeSite.</td>      </tr>      <tr>        <td>skuId</td>        <td>"string"</td>        <td>"560193"</td>        <td>          Unique identifier assigned to individual product items.           Where a product has variations, such as color, each variation will have its own skuId. Same as itemNumber.        </td>      </tr>      <tr>        <td>skuIds</td>        <td>"string"</td>        <td>"560193, 253729, 253737</td>        <td>          The skuIds are the same as itemNumbers.        </td>      </tr>      <tr>        <td>specialInstruction</td>        <td>"string"</td>        <td>"Ship to 789 Hover Lane IN, Fishers 46037 in the front yard"</td>        <td>Text field where notes can be added to provide any extra information needed regarding the order or its delivery.</td>      </tr>      <tr>        <td>state</td>        <td>"string"</td>        <td>"WA"</td>        <td>Two digit state code.</td>      </tr>      <tr>        <td>unitOfMeasure</td>        <td>"string"</td>        <td>"BDL"</td>        <td>          Designates the units by which an item is sold individually. Unit of measure can vary for each item number. This is the same as uom.        </td>      </tr>      <tr>        <td>uom</td>        <td>"string"</td>        <td>"BDL"</td>        <td>          Designates the units by which an item is sold individually. Unit of measure can vary for each item number. This is the same as unitOfMeasure.        </td>      </tr>      <tr>        <td>userAgent</td>        <td>"string"</td>        <td>"desktop"</td>        <td>userAgent should be should be either desktop, tablet, mobile.</td>      </tr>      <tr>        <td>username</td>        <td>"string"</td>        <td>"user@email.com"</td>        <td>Email address tied to account.</td>      </tr>      <tr>        <td>UUID</td>        <td>"string"</td>        <td>"41cf3908-fe11-45ce-899c-9390c8299a18"</td>        <td>          Unique identifier assigned by customer in GUID format and is same as atgUUID.        </td>      </tr>    </tbody>  </table></details>
