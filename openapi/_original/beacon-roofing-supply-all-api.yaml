  "/createUser":
    post:
      operationId: V2Controller_createUser
      summary: Creates a new user account
      description: |2

        Creates a new user account and assigns user permissions. Admin or Master Admin can use user templates to specify role permissions. If default role template is used, the user will receive default role permissions. If user role needs customized permissions, the “permissionValues” will is required to assign custom roles.

        currentTemplate enumeration

        <ul>
            <li>
                "Default Role Template"
            </li>
            <li>
                "Customized Permission"
            </li>
            <li>
                any other string value
            </li>
        </ul>

        When <b>currentTemplate</b> is "Default Role Template", will use the default role permission as user permission values

        When <b>currentTemplate</b> is "Customized Permission", the permissionValues field is required, and will use given "permissionValues" as user permission values

        When <b>currentTemplate</b> is any other string value, the permissionTemplate.templateId field is required, and will use the permissions of given permission template as user permission values

        status enumeration

        <ul>
            <li>
                "Active"
            </li>
            <li>
                "InActive"
            </li>
        </ul>
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/createUserBody"
      responses:
