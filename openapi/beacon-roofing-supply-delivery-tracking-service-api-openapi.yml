        '500':
          description: Internal exception
      operationId: postDeleteNotifications
      x-operation-id-source: derived
  /deleteAllNotifications:
    post:
      security:
      - JSESSIONID: []
        DYN_USER_ID: []
        DYN_USER_CONFIRM: []
        siteId: []
        rememberPassword: []
      tags:
      - Delivery Tracking Service
      summary: Delete All Notifications
      responses:
        '200':
          description: 'successful operation


            refer to *API Uniform Format*

            '
        '400':
          description: Bad Request, the request method is not valid
        '401':
          description: Unauthorized, user do not login
        '500':
          description: Internal exception
      operationId: postDeleteAllNotifications
      x-operation-id-source: derived
components:
  schemas:
    getStatusChangeNotification_rep:
      type: object
      properties:
        messageCode:
          type: string
        message:
          type: string
        emailAddress:
          type: string
        dtPhoneNumber:
          type: string
        dtStatusChangeNotification:
          type: array
          items:
            $ref: '#/components/schemas/deliveryStatusObj'
        dtAdminStatusChangeNotification:
          type: array
          items:
            $ref: '#/components/schemas/deliveryStatusObj'
        dtAccountStatusChangeNotification:
          type: array
          items:
            $ref: '#/components/schemas/deliveryStatusObjWithAccount'
        dtOrderStatusChangeNotification:
          type: object
          properties:
            notifications:
              type: array
              items:
                $ref: '#/components/schemas/radioButtonObj'
    deleteNotifications_req:
      type: object
      properties:
        deleteNotificationIds:
          type: string
    UpcomingDeliveriesRep:
      type: object
      properties:
        upcomingDeliveries:
          type: array
          items:
            $ref: '#/components/schemas/UpcomingDeliveryObj'
    UserNotificationModification_req:
      type: object
      properties:
        userNotifications:
          type: array
          items:
            $ref: '#/components/schemas/UserNotificationModification'
    statusChangeNotification_req:
      type: object
      properties:
        dtEmailAddress:
          type: string
        dtPhoneNumber:
          type: string
        dtStatusChangeNotification:
          $ref: '#/components/schemas/statusChangeNotification'
        dtAdminStatusChangeNotification:
          $ref: '#/components/schemas/statusChangeNotification'
        dtAccountStatusChangeNotification:
          type: array
          items:
            $ref: '#/components/schemas/accountStatusChangeNotification'
    UserNotificationItem:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        orderId:
          type: string
          description: Order number.
        accountToken:
          type: string
          description: Account Token for order.
        status:
          type: string
          description: (Received, Scheduled, Delivered, EnRoute, Arrived).
        read:
          type: boolean
          description: Read status (has customer read notification) true or false.
        title:
          type: string
        subtitle:
          type: string
        timestamp:
          type: number
          format: long
          description: Timestamp notification was created.
    getDeliverySetting_rep:
      type: object
      properties:
        result:
          type: object
          properties:
            dtNotificationSettings:
              type: object
              properties:
                received:
                  type: boolean
                scheduled:
                  type: boolean
                ordered:
                  type: boolean
                enRoute:
                  type: boolean
                arrived:
                  type: boolean
            quoteNotificationSettings:
              type: object
              properties:
                readyForReview:
                  type: boolean
            disableStatus:
              type: boolean
            changeTime:
              type: string
        success:
          type: boolean
        message:
          type: string
    saveDeliverySetting_rep:
      type: object
      properties:
        result:
          type: string
        message:
          type: string
        success:
          type: boolean
    saveDeliverySettingReq:
      type: object
      properties:
        dtNotificationSettings:
          type: object
          properties:
            received:
              type: boolean
            scheduled:
              type: boolean
            ordered:
              type: boolean
            enRoute:
              type: boolean
            arrived:
              type: boolean
        disableStatus:
          type: boolean
        changeTime:
          type: string
        accounts:
          type: array
          items:
            type: string
        quoteNotificationSettings:
          type: object
          properties:
            readyForReview:
              type: boolean
    statusChangeNotification_rep:
      type: object
      properties:
        messageCode:
          type: string
        message:
          type: string
    radioButtonObj:
      type: object
      properties:
        displayName:
          type: string
        value:
          type: string
        selected:
          type: boolean
    deliveryStatusObj:
      type: object
      properties:
        displayName:
          type: string
        label:
          type: string
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/radioButtonObj'
    UpcomingDeliveryObj:
      type: object
      properties:
        jobNumber:
          type: string
        jobName:
          type: string
        branchNo:
          type: string
        customerNo:
          type: string
        street:
          type: string
        mincronOrderNo:
          type: string
        estimatedArrival:
          type: string
        estimatedArrivalDate:
          type: string
        plannedArrival:
          type: string
        plannedArrivalDate:
          type: string
        actualArrival:
          type: string
        salesPeople:
          type: string
        dtStatus:
          type: string
        dtDate:
          type: string
        po:
          type: string
        orderDetailLink:
          type: string
    getNotifications_pagination:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/BCPaginationDataObj'
        userNotifications:
          type: array
          items:
            $ref: '#/components/schemas/UserNotificationItem'
    accountStatusChangeNotification:
      type: object
      properties:
        requested:
          type: string
        scheduled:
          type: string
        delivered:
          type: string
        accountId:
          type: string
    BCPaginationDataObj:
      type: object
      properties:
        next:
          $ref: '#/components/schemas/BCOtherPaginationObj'
        previous:
          $ref: '#/components/schemas/BCOtherPaginationObj'
        pageSize:
          type: integer
        currentPage:
          type: integer
        totalCount:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/BCPaginationObj'
    BCPaginationObj:
      type: object
      properties:
        enable:
          type: boolean
        page:
          type: integer
        currentPage:
          type: boolean
        type:
          type: string
    deliveryStatusObjWithAccount:
      type: object
      properties:
        accountId:
          type: string
        statusLabels:
          type: array
          items:
            $ref: '#/components/schemas/deliveryStatusObj'
    getNotifications_rep:
      type: object
      properties:
        success:
          type: boolean
        messages:
          type: string
        result:
          $ref: '#/components/schemas/getNotifications_pagination'
    statusChangeNotification:
      type: object
      properties:
        requested:
          type: string
        scheduled:
          type: string
        delivered:
          type: string
    UserNotificationModification:
      type: object
      properties:
        userNotificationId:
          type: string
        readStatus:
          type: boolean
          description: Read status (has customer read notification) true or false.
    BCOtherPaginationObj:
      type: object
      properties:
        available:
          type: boolean
        label:
          type: string
        page:
          type: integer
  securitySchemes:
    JSESSIONID:
      type: apiKey
      in: cookie
      name: JSESSIONID
    DYN_USER_ID:
      type: apiKey
      in: cookie
      name: DYN_USER_ID
    DYN_USER_CONFIRM:
      type: apiKey
      in: cookie
      name: DYN_USER_CONFIRM
    siteId:
      type: apiKey
      in: cookie
      name: siteId
    rememberPassword:
      type: apiKey
      in: cookie
      name: siteId
