      summary: Update saved/pending order shipping info
      description: 'This service can update saved or pending order shipping information for


        a given saved order Id.


        deliveryOption: "scheduled" or "onHold", when "scheduled",

        "deliveryDate" and "deliveryTime" is needed


        shippingMethod: "Ship_to" or "Pick_up"


        Ship_to example :


        ```

        {

        "orderId":"33400002",

        "deliveryOption":"onHold",

        "shippingMethod":"Ship_to",

        "shippingAddress":{

        "address1":"testaddress",

        "address2":"",

        "city":"test city",

        "state":"AZ",

        "states":null,

        "postalCode":"12345",

        "country":"USA"

        },

        "contactInfo":{

        "phoneNumber":"1234567990",

        "firstName":"",

        "lastName":"testolivia",

        "nickName":"testolivia"

        },

        "instructions":"ppererr111"

        }

        ```


        Pick_up example :


        ```

        {

        "orderId":"33400002",

        "deliveryOption":"scheduled",

        "deliveryDate":"06-28-2018",

        "deliveryTime":"Afternoon",

        "shippingMethod":"Pick_up",

        "shippingAddress":{

        "displayName":"DENVER BRANCH",

        "address1":"DENVER BRANCH - STATEWIDE",

        "address2":"1205 S PLATTE RIVER DR.",

        "city":"DENVER",

        "state":"CO",

        "postalCode":"80223-3100",

        "phoneNumber":"3037447111",

        "address3":""

        },

        "branchName":"",

        "contactInfo":{

        "firstName":"",

        "lastName":"",

        "nickName":"",

        "phoneNumber":"3037447111"

        },

        "instructions":"pppdd"

        }

        ```'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateSavedOrderShippingInfo_req'
      responses:
