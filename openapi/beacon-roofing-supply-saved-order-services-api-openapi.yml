- name: Saved Order Services
paths:
  /saveOrder:
    post:
      security:
      - JSESSIONID: []
        DYN_USER_ID: []
        DYN_USER_CONFIRM: []
        siteId: []
      tags:
      - Saved Order Services
      summary: Create new saved order and save current cart to this order
      description: 'This service can create a new saved order and add current shopping cart

        items to the newly created saved order.


        po, jobName, jobNumber , additionalRecipients are optional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                savedOrderName:
                  type: string
                po:
                  type: string
                jobName:
                  type: string
                jobNumber:
                  type: string
                emptyCart:
                  type: boolean
                  description: A flag whether empty user current shopping cart, it's true or empty value, empty cart, else keep current cart.
                additionalRecipients:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: 'successful operation


            refer to *API Uniform Format*

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/saveOrderRep'
        '401':
          description: Unauthorized, the authorization bearer token is invalid
        '403':
          description: Forbidden, user do not has permission to access this API
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '419':
          description: Unauthorized, the authorization bearer token is expired
        '500':
          description: Internal exception
      operationId: postSaveOrder
      x-operation-id-source: derived
  /getOrderApprovalList:
    post:
      security:
      - JSESSIONID: []
        DYN_USER_ID: []
        DYN_USER_CONFIRM: []
        siteId: []
      tags:
      - Saved Order Services
      summary: List saved/pending orders
      description: 'This service is able to list saved or pending orders.


        If approverId is empty, it will be treat as Get Saved/Pending Order list


        If approverId not empty, it will be treat as get ''Pending Order by

        Approver''


        1.sortBy value


        Pending Order:displayName,accountNumber,createdUser,submittedDate


        Saved Order:displayName,accountNumber,lastModifiedDate,status,creationDate,submittedDate


        2.status value:


        Pending Order: READY_FOR_APPROVAL


        Saved Order:READY_FOR_SUBMISSION


        Rejected Order: REJECTED_ORDER


        3.searchBy value


        Pending Order:displayName,accountNumber,createdUser.email,submittedDate


        Saved Order:displayName,accountNumber,creationDate,createdUser.name,createdUser.email,lastModifiedDate,lastModifiedUser.name,lastModifiedUser.email,submittedDate,submittedUser.name,submittedUser.email


        4.searchBy ''submittedDate'' or ''creationDate'' its format value is

        ''MM-dd-yyyy''.eg,07-30-2019


        5.''sortBy'' ''searchBy'' are not required. But if set value, it''s limited

        by the given values.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/getOrderApprovalList_req'
      responses:
        '200':
          description: 'successful operation


            refer to *API Uniform Format*

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getOrderApprovalList_rep'
        '401':
          description: Unauthorized, the authorization bearer token is invalid
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '419':
          description: Unauthorized, the authorization bearer token is expired
        '500':
          description: Internal exception
      operationId: postGetOrderApprovalList
