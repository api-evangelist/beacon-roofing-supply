  version: '1.0'
  contact: {}
servers: []
tags:
- name: GetMultipleProductVariation
paths:
  /getMultipleProductVariation:
    post:
      operationId: V2Controller_getMultipleProductVariation
      summary: Returns product variation by product Id
      description: Returns sku Id and color variations for specific product Id.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/getMultipleProductVariationBody'
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getMultipleProductVariationResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - GetMultipleProductVariation
components:
  schemas:
    Skus:
      type: object
      properties:
        '300003':
          $ref: '#/components/schemas/_300003'
        '600001':
          $ref: '#/components/schemas/_300003'
        '600002':
          $ref: '#/components/schemas/_300003'
      required:
      - '300003'
      - '600001'
      - '600002'
    getMultipleProductVariationResponse:
      type: object
      properties:
        productId:
          type: string
        productMultiVariation:
          $ref: '#/components/schemas/ProductMultiVariation'
        variationContentKeyMap:
          $ref: '#/components/schemas/VariationContentKeyMap'
      required:
      - productId
      - productMultiVariation
      - variationContentKeyMap
    VariationContentKeyMap:
      type: object
      properties: {}
    getMultipleProductVariationBody:
      type: object
      properties:
        productId:
          type: string
        skuId:
          type: string
        vendorColorId:
          type: string
      required:
      - productId
      - skuId
      - vendorColorId
    Thickness:
      type: object
      properties:
        2mm:
          type: array
          items:
            type: string
        4mm:
          type: array
          items:
            type: string
        6mm:
          type: array
          items:
            type: string
      required:
      - 2mm
      - 4mm
      - 6mm
    CurrentVariations:
      type: object
      properties:
        color:
          type: string
        size:
          type: string
        diameter:
          type: string
        thickness:
          type: string
        style:
          type: string
        packaging:
          type: string
        MFG:
          type: string
      required:
      - color
      - size
      - diameter
      - thickness
      - style
      - packaging
      - MFG
    Variations:
      type: object
      properties:
        color:
          $ref: '#/components/schemas/Color'
        size:
          $ref: '#/components/schemas/Size'
        thickness:
          $ref: '#/components/schemas/Thickness'
      required:
      - color
      - size
      - thickness
    VariationGroup:
      type: object
      properties:
        variationTypes:
          type: array
          items:
            type: string
      required:
      - variationTypes
    Color:
      type: object
      properties:
        White:
          type: array
          items:
            type: string
        Dover:
          type: array
          items:
            type: string
      required:
      - White
      - Dover
    _300003:
      type: object
      properties:
        color:
          type: array
          items:
            type: string
        size:
          type: array
          items:
            type: string
        thickness:
          type: array
          items:
            type: string
      required:
      - color
      - size
      - thickness
    Size:
      type: object
      properties:
        12x10:
          type: array
          items:
            type: string
        4x4:
          type: array
          items:
            type: string
      required:
      - 12x10
      - 4x4
    ProductMultiVariation:
      type: object
      properties:
        currentSkuId:
          type: string
        skus:
          $ref: '#/components/schemas/Skus'
        variations:
          $ref: '#/components/schemas/Variations'
        vendorColors:
          type: array
          items:
            $ref: '#/components/schemas/VendorColor'
        allVariationTypes:
          type: array
          items:
            type: string
        currentVariations:
          $ref: '#/components/schemas/CurrentVariations'
        variationKeyMFG:
          type: string
        variationKeyColor:
          type: string
        variationGroups:
          type: array
          items:
            $ref: '#/components/schemas/VariationGroup'
        maxVariationGroupSize:
          type: number
      required:
      - currentSkuId
      - skus
      - variations
      - vendorColors
      - allVariationTypes
      - currentVariations
      - variationKeyMFG
      - variationKeyColor
      - variationGroups
      - maxVariationGroupSize
    VendorColor:
      type: object
      properties:
        id:
          type: string
        MFG:
          type: string
        name:
          type: string
        code:
          type: string
        sku:
          type: string
        color:
          type: string
      required:
      - id
      - MFG
      - name
      - code
      - sku
      - color
