servers: []
tags:
- name: SubmitQuoteForm
paths:
  /submitQuoteForm:
    post:
      operationId: V2Controller_submitQuoteForm
      summary: Submits quote form
      description: Submits quote form for quotes created with an attachment using form data.
      parameters:
      - name: userName
        required: false
        in: path
        description: User’s full name
        schema:
          type: string
      - name: contactNumber
        required: false
        in: path
        description: User’s contact phone number
        schema:
          type: number
      - name: uploadDocument
        required: false
        in: path
        description: The document file to upload. Accepted file types include .pdf, .csv, .doc(x), .tiff, and .xls(x). File size needs to be between 0KB~10MB.
        schema:
          type: string
      - name: jobNumber
        required: false
        in: path
        description: The job number
        schema:
          type: string
      - name: workType
        required: false
        in: path
        description: Work type should be either "N" for new construction or "R" for remodel.
        schema:
          type: string
      - name: quoteNotes
        required: false
        in: path
        description: Notes added by user in reference to quote
        schema:
          type: string
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - SubmitQuoteForm
