  version: '1.0'
  contact: {}
servers: []
tags:
- name: HoverExplicitLogin
paths:
  /hoverExplicitLogin:
    post:
      operationId: V2Controller_hoverExplicitLogin
      summary: Hover explicit login
      description: This service supplies explicit login for Hover users.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hoverExplicitLoginBody'
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hoverExplicitLoginResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - HoverExplicitLogin
components:
  schemas:
    hoverExplicitLoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        uuid:
          type: string
        ua:
          type: string
        siteId:
          type: string
        persistentLoginType:
          type: string
        userAgent:
          type: string
      required:
      - username
      - password
      - uuid
      - ua
      - siteId
      - persistentLoginType
      - userAgent
    hoverExplicitLoginResponse:
      type: object
      properties:
        nextUrl:
          type: string
      required:
      - nextUrl
