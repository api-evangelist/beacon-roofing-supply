  securitySchemes:
    JSESSIONID:
      type: apiKey
      in: cookie
      name: JSESSIONID
    DYN_USER_ID:
      type: apiKey
      in: cookie
      name: DYN_USER_ID
    DYN_USER_CONFIRM:
      type: apiKey
      in: cookie
      name: DYN_USER_CONFIRM
    siteId:
      type: apiKey
      in: cookie
      name: siteId
    rememberPassword:
      type: apiKey
      in: cookie
      name: rememberPassword
paths:
  /login:
    post:
      security: []
      tags:
        - My Account Services
      summary: User login with username/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/loginReq'
      responses:
        '200':
          description: |
            Login success

            If failed, return messageCode, refer to messageCode doc.

            Example

            { "messageCode": "1001", "messageInfo": "Validation exception" }
          headers:
            Set-Cookie:
              description: 'set cookie JSESSIONID, DYN_USER_ID, DYN_USER_CONFIRM, siteId, rememberPassword'
              schema:
                type: string
                example: >-
                  JSESSIONID=xxxx; Path=/; Secure; HttpOnly, DYN_USER_ID=xxxx;
                  expires=xxxx; path=/; Secure; HttpOnly, DYN_USER_CONFIRM=xxxx;
                  expires=xxxx; path=/; Secure; HttpOnly, siteId=homeSite;
                  expires=xxxx; path=/; Secure; HttpOnly, rememberPassword=xxxx;
                  expires=xxxx; path=/; Secure; HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/loginRep'
        '400':
          description: 'Bad Request, the request method is not valid'
  /logout:
    post:
      security: []
      tags:
        - My Account Services
      summary: User logout
      responses:
        '200':
          description: |
            Logout success

            If failed, return messageCode, refer to messageCode doc.

            Example

            { "messageCode": "1001", "messageInfo": "Validation exception" }
          headers:
            Set-Cookie:
              description: 'remove cookie JSESSIONID, DYN_USER_ID, DYN_USER_CONFIRM, siteId, rememberPassword'
              schema:
                type: string
                example: >-
                  JSESSIONID=xxxx; Path=/; Secure; HttpOnly, DYN_USER_ID=xxxx;
                  expires=xxxx; path=/; Secure; HttpOnly, DYN_USER_CONFIRM=xxxx;
                  expires=xxxx; path=/; Secure; HttpOnly, rememberPassword=xxxx;
                  expires=xxxx; path=/; Secure; HttpOnly
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageInfo:
                    type: string
                    example: Logout successful
        '400':
          description: 'Bad Request, the request method is not valid'
        '401':
          description: 'Unauthorized, user do not login'
        '500':
          description: Internal exception
  /getLoginDeclaration:
    get:
      security: []
      tags:
        - My Account Services
      summary: Get login declaration
      parameters:
        - in: query
          name: siteId
          schema:
            type: string
          description: Default is `homeSite`, should be one of `homeSite`, `dealersChoice`
        - in: query
          name: persistentLoginType
          schema:
            type: string
          description: Default is `RememberMe`, should be one of `RememberMe`, `RememberPassword`
        - in: query
          name: userAgent
          schema:
            type: string
          description: Default is `desktop`, should be one of `desktop`, `tablet`, `mobile`
        - in: query
          name: apiSiteId
          schema:
            type: string
          description: Default is `UAT`
      responses:
        '200':
          description: |
            successful operation

            If failed, return messageCode, refer to messageCode doc.

            Example

            { "messageCode": "1001", "message": "Validation exception" }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getLoginDeclarationRep'
        '405':
          description: 'Method not allowed, the request method is not valid for this API or this API is not available.'
        '500':
          description: Internal exception
  /getCurrentUserInfo:
    get:
      security:
        - JSESSIONID: []
          DYN_USER_ID: []
          DYN_USER_CONFIRM: []
          siteId: []
          rememberPassword: []
      tags:
        - My Account Services
      summary: Get current user details
      description: |
        This service returns current user information.

        `dtAccount` is the deliveryTrackingSettings of current user with last selected account,

        `roleType` is one of "Master Admin","Admin",and "Site User"
        
        `isEVrefreshTokenValid` is one of "true", "false", and "null". If the value is "null", it indicates that the user does not have a private okta token.

      responses:
        '200':
          description: |
            successful operation

            If failed, return messageCode, refer to messageCode doc.
              
            Example

            { "messageCode": "1001", "message": "Validation exception" }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getCurrentUserInfoRep'
        '401':
          description: 'Unauthorized, user do not login'
        '405':
          description: 'Method not allowed, the request method is not valid for this API or this API is not available.'
        '500':
          description: Internal exception
  /accounts:
    get:
      security:
        - JSESSIONID: []
          DYN_USER_ID: []
          DYN_USER_CONFIRM: []
          siteId: []
          rememberPassword: []
      tags:
        - My Account Services
      summary: List all available accounts for the user
      parameters:
        - in: query
          name: profileId
          schema:
            type: string
          required: true
          description: User profile ID
      responses:
        '200':
          description: |
            successful operation

            If failed, return messageCode, refer to messageCode doc.
              
            Example

            { "messageCode": "1001", "message": "Validation exception" }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accountsRep'
        '400':
          description: 'Bad Request, profileId does not math logged-in user'
        '401':
          description: 'Unauthorized, user do not login'
        '405':
          description: 'Method not allowed, the request method is not valid for this API or this API is not available.'
        '500':
          description: Internal exception
  /switchAccount:
    post:
      security:
        - JSESSIONID: []
          DYN_USER_ID: []
          DYN_USER_CONFIRM: []
          siteId: []
          rememberPassword: []
      tags:
        - My Account Services
      summary: Change user's current account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: string
      responses:
        '200':
          description: |
            successful operation

            If failed, return messageCode, refer to messageCode doc.
              
            Example

            { "messageCode": "1001", "message": "Validation exception" }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getCurrentUserInfoRep'
        '400':
          description: 'Bad Request, the request method is not valid'
        '401':
          description: 'Unauthorized, user do not login'
        '500':
          description: Internal exception
  /branchlist:
    get:
      security:
        - JSESSIONID: []
          DYN_USER_ID: []
          DYN_USER_CONFIRM: []
          siteId: []
          rememberPassword: []
      tags:
        - Branch Services
      summary: List all available branches
      parameters:
        - in: query
          name: zipCode
          schema:
            type: string
          required: false
          description: Branch postal code
        - in: query
          name: city
          schema:
            type: string
          required: false
          description: Branch city
        - in: query
          name: pageSize
          schema:
            type: integer
          required: false
          description: Default page size is 21.
        - in: query
          name: pageNo
          schema:
            type: integer
          required: false
          description: 'Default page number is 1, the first page'
      responses:
        '200':
          description: |
            successful operation

            If failed, return messageCode, refer to messageCode doc.
              
            Example

            { "messageCode": "1001", "message": "Validation exception" }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/branchlistRep'
        '401':
          description: 'Unauthorized, user do not login'
        '405':
          description: 'Method not allowed, the request method is not valid for this API or this API is not available.'
        '500':
          description: Internal exception
  /jobs:
    get:
      security:
        - JSESSIONID: []
          DYN_USER_ID: []
          DYN_USER_CONFIRM: []
          siteId: []
          rememberPassword: []
      tags:
