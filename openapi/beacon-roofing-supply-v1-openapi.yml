        <p> 1. This service calls mincron jobs service to retrieve list of jobs for the
        account and provide the job name and number combination rule. </p>
        
        <p>2. "isJobAccountRequired" field is outdated in the response payload. Please refer to below combination rule to render the page.</p>
        <p>3. Job name,number and job list combination rule:</p>
          1). <b>Job Account Drop Down</b>: the option is selected in drop-down will be filled into "jobNumber" field when invoking /submitOrder or /submitQuote endpoint. </br>
          2). <b>Job Name Text Field</b>: the value will be filled into "jobName" field when invoking /submitOrder or /submitQuote endpoint.
        <table id="job" border="1">
