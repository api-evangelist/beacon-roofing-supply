      - categoryId
    Category3:
      type: object
      properties:
        facetId:
          type: string
        facetName:
          type: string
        selected:
          type: boolean
        children:
          type: array
          items:
            $ref: '#/components/schemas/Child2'
      required:
      - facetId
      - facetName
      - selected
      - children
    Category2:
      type: object
      properties:
        categoryName:
          type: string
        categoryId:
          type: string
        recordCount:
          type: number
        facetId:
          type: string
      required:
      - categoryName
      - categoryId
      - recordCount
      - facetId
    Item:
      type: object
      properties:
        filter:
          type: string
      required:
      - filter
    Child:
      type: object
      properties:
        facetId:
          type: string
        facetName:
          type: string
        recordCount:
          type: number
        selected:
          type: boolean
      required:
      - facetId
      - facetName
      - recordCount
      - selected
    Child2:
