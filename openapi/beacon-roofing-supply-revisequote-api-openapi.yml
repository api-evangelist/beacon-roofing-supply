  version: '1.0'
  contact: {}
servers: []
tags:
- name: ReviseQuote
paths:
  /reviseQuote:
    post:
      operationId: V2Controller_reviseQuote
      summary: Revises quote
      description: Revises the notes in a quote in ready for review status. If quote Id is invalid, empty or quote status is not in ready for review status, will result in an error message. If quote Id is valid and in ready for review status, notes will update, and quote submitter will receive email notifying of changes.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/reviseQuoteBody'
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - ReviseQuote
components:
  schemas:
    reviseQuoteBody:
      type: object
      properties:
        quoteId:
          type: string
        quoteNotes:
          type: string
      required:
      - quoteId
      - quoteNotes
