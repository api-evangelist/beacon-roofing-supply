openapi: 3.2.0
info:
  title: Beacon Rest Services V2 API
  description: 'A combination of all methods in the beacon-api


    [ BASE URL: https://beaconproplus.com


    Beacon ProPlus


    Version 1: https://beaconproplus.com/v1/rest/com/becn


    Version 2: https://beaconproplus.com/v2/rest/com/becn


    Version 3: https://beaconproplus.com/v3/rest/com/becn


    Beacon Stack


    [ BASE URL: https://beacon-api-x7xzzdp35a-uk.a.run.app


    Version 1: https://beacon-api-x7xzzdp35a-uk.a.run.app/v1/rest/com/becn/


    Version 2: https://beacon-api-x7xzzdp35a-uk.a.run.app/v2/rest/com/becn/


    Version 3…'
  version: '1.0'
  contact: {}
servers: []
tags:
- name: v2
paths:
  /getCurrentUserInfo:
    get:
      operationId: V2Controller_getCurrentUserInfo
      summary: Returns user details
      description: This service returns details for a logged in user. In this response, dtAccount is the deliveryTrackingSettings of current user with last selected account and roleType is one of "Master Admin","Admin", or "Site User".
      parameters: []
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getCurrentUserInfoResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - v2
  /orderhistory:
    get:
      operationId: V2Controller_orderhistory
      summary: Returns orders listed by order id
      description: Returns order information for each order including order totals, selling branch, special instructions, and shipping information.
      parameters:
      - name: accountId
        required: true
        in: path
        description: Account Id
        schema:
          type: number
      - name: pageSize
        required: false
        in: path
        description: Default page size is 0
        schema:
          type: number
      - name: pageNo
        required: false
        in: path
        description: Default page no is 0
        schema:
          type: number
      - name: filter
        required: false
        in: path
        description: '<h4>Notice</h4><p>The filter value should be URL encoded to avoid special characters issues(e.g. % with numbers)</p><h4>filter enumeration</h4><ul><li>UPPER(OrderNumber) like UPPER("%XX%")</li><li>ShippingAddress1 like "%XXX%" or UPPER(ShippingAddress2) like UPPER("%XXX%")</li><li>UPPER(PurchaseOrderNumber) like UPPER("%XX%")</li><li>UPPER(JobName) like UPPER("%XX%")</li><li>UPPER(Ordered) > "YYYY-MM-DD" and UPPER(Ordered) < "YYYY-MM-DD"</li><li>UPPER(OrderStatusCode) in ("C", "K")</li><li>UPPER(OrderStatusCode) in ("I")</li><li>UPPER(OrderStatusCode) in ("O")</li><li>UPPER(OrderStatusCode) in ("N")</li><li>UPPER(OrderStatusCode) in ("P", "R")</li><li>UPPER(ItemOrProductDescription) like UPPER("%XXX%") or ItemNumber like "%XXX%"</li><li>UPPER(SourceOfSale) like UPPER("C") or UPPER(SourceOfSale) like UPPER("E")</li><li>UPPER(SourceOfSale) in ("C") or UPPER(SourceOfSale) in ("E")</li><li>UPPER(SourceOfSale) = "C" or UPPER(SourceOfSale) = "E"</ul></li><h4>OrderStatusCode mapping</h4><ul><li>C, K: Processing</li><li>I: Invoiced</li><li>O: Ready Delivery / Pick up</li><li>N: Pending</li><li>P, R: Delivered</li></ul><h4>SourceOfSale mapping</h4><ul><li>C: In - Store</li><li>E: Online</li></ul>'
        schema:
          type: string
      - name: orderBy
        required: false
        in: path
        description: <h4>orderBy enumeration</h4><ul><li>OrderNumber ASC/ DESC</li><li>ShippingAddress1 ASC / DESC</li><li>Total ASC / DESC</li><li>OrderStatusCode ASC / DESC</li><li>SourceOfSale ASC / DESC</li></ul>
        schema:
          type: string
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orderhistoryResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - v2
  /orderdetail:
    get:
      operationId: V2Controller_orderdetail
      summary: Returns order details by order Id
      description: Returns order details by order Id. If OAuth is enabled, token is passed in header. Order status codes include (I) Invoiced, (R) Reviewed, (P) Priced, (C) Changed, (O) Open, (K) Reserved, (N) Pending. For eagleView order, specialInstruction field in response will be replaced with report address.
      parameters:
      - name: orderId
        required: true
        in: path
        description: Order Id
        schema:
          type: string
      - name: accountId
        required: true
        in: path
        description: Account Id
        schema:
          type: string
      - name: accountToken
        required: true
        in: path
        description: Account Token
        schema:
          type: string
      - name: showDT
        required: false
        in: path
        description: Flag to show/hide DT order status info, default is true.
        schema:
          type: string
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orderdetailResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - v2
  /pricing:
    get:
      operationId: V2Controller_pricing
      summary: Returns price and unit of measure for item number(s)
      description: Returns price and unit of measure for item numbers. Items with no unit of measure will return “EMPTY_UOM” in response. There is no limit in the number of items in query.
      parameters:
      - name: skuIds
        required: false
        in: path
        description: 'skuIds: Separate SKU Id''s with commas.<br><br>Example: "253729,253737,253740"<br><br>If querying for items specified by unit of measure, add unit of measure followed by colon.<br><br>Example: "253729:BDL,253737,253740:PC"'
        schema:
          type: string
      - name: accountId
        required: false
        in: path
        description: Account Id
        schema:
          type: string
      - name: jobNumber
        required: false
        in: path
        description: Job Number
        schema:
          type: string
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pricingResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - v2
  /cartItems:
    get:
      operationId: V2Controller_cartItems
      summary: Retrieves items from cart
      description: Retrieves added items from the cart for the user profile within selected account. This end point allows you to return variations of each item.
      parameters:
