info:
  title: Beacon Roofing Supply Catalog ITEM Services API
  version: '1.0'
  description: 'Operations tagged Catalog ITEM Services across 2 of this provider''s published API definitions: beacon-roofing-supply-v2-openapi.yml, beacon-roofing-supply-v3-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://beaconproplus.com/v2/rest/com/becn
  description: 'Production. Added by API Evangelist; the harvested document carried no servers[]. Source: info.description of this spec: ''[ PROD BASE URL: https://beaconproplus.com/v2/rest/com/becn ]'''
- url: https://beaconproplus.com/v3/rest/com/becn
  description: 'Production. Added by API Evangelist; the harvested document carried no servers[]. Source: info.description of the all_api spec: ''Version 3: https://beaconproplus.com/v3/rest/com/becn''; probed 2026-09-04 -> 401 JSON envelope'
tags:
- name: Catalog ITEM Services
paths:
  /typeAhead:
    get:
      security:
      - JSESSIONID: []
        DYN_USER_ID: []
        DYN_USER_CONFIRM: []
        siteId: []
      tags:
      - Catalog ITEM Services
      summary: Get type ahead items
      description: This service will get type ahead items information.
      parameters:
      - in: query
        name: accountId
        required: true
        schema:
          type: string
      - in: query
        name: filter
        required: true
        description: "Search terms\n\nThis parameter also support the following syntax:\n\n* `productId:ID1,ID2...IDn`\n  * Filter by given product ID list, separated by comma. e.g. \"productId:C-010001,C-010002,C-010003\"\n"
        schema:
          type: string
      - in: query
        name: maxSearchSuggestions
        description: Max returned type ahead items size, default is 6
        schema:
          type: number
      responses:
        '200':
          description: 'successful operation


            refer to *API Uniform Format*

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/typeAhead_rep'
        '401':
          description: Unauthorized, the authorization bearer token is invalid
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '419':
          description: Unauthorized, the authorization bearer token is expired
        '500':
          description: Internal exception
      operationId: getTypeAhead
      x-operation-id-source: derived
    servers:
    - url: https://beaconproplus.com/v2/rest/com/becn
      description: 'Production. Added by API Evangelist; the harvested document carried no servers[]. Source: info.description of this spec: ''[ PROD BASE URL: https://beaconproplus.com/v2/rest/com/becn ]'''
  /itemlist:
    get:
      security:
      - JSESSIONID: []
        DYN_USER_ID: []
        DYN_USER_CONFIRM: []
        siteId: []
      tags:
      - Catalog ITEM Services
      summary: Get list of items
      description: 'This service will list all the products for selected account, based on availability.

        ### Request Parameters:

        * If recentlyPurchase:true in facetsFilter but accountId is empty, will return no results.'
      parameters:
      - in: query
        name: accountId
        schema:
          type: string
        description: Account ID
        required: true
      - in: query
        name: pageSize
        description: Default page size is 21. Max Page Size can be configured in BCC, maxPageSize default value is 30. If pageSize exceeds maxPageSize, the amount of maxPageSize items return.
        schema:
          type: integer
          format: int32
      - in: query
        name: pageNo
        description: Default page no is 1, the first page
        schema:
          type: integer
          format: int32
      - in: query
        name: filter
        description: "Search terms\n\nThis parameter also support the following syntax:\n\n* `productId:ID1,ID2...IDn`\n  * Filter by given product ID list, separated by comma. e.g. \"productId:C-010001,C-010002,C-010003\"\n"
        schema:
          type: string
      - in: query
        name: cateFilter
        description: Category search terms
        schema:
          type: string
      - in: query
        name: facetsFilter
        description: "Filter syntax:\n* `recentlyPurchase:true`\n  * Default is false, if true, will filter the results with recently purchase\n* `frequentlyPurchase:true`\n  * Default is false, if true, will filter the results with frequently purchase, frequentlyPurchase and recentlyPurchase can not be use together.\n* Facets search IDs, separated by comma\n  * e.g. \"4294965847,4294965836\"\n* Indicate which dimension to search, `<facet type>:<facet name>`, separated by comma, case insensitive, ignore white space\n  * e.g. \"size:0ft x 2ft,packaging:100 bag,thickness:102mm,style:A Slop,color: Beige\"\n* Special charactors should be URL encoded then append to query string\n  * e.g. raw: 'facetsFilter=Thickness:20_,Thickness:20\",Thickness:20mm,Size:\"9 x \"12,Size:#12,Size:1! x 1!,Size:1-5/8\",Size:10\" x 15\",Size:100' x 200',Size:2-7/8\",Size:6> x 500<'\n  * e.g. URL encoded: 'facetsFilter=Thickness%3a20_%2cThickness%3a20%22%2cThickness%3a20mm%2cSize%3a%229+x+%2212%2cSize%3a%2312%2cSize%3a1!+x+1!%2cSize%3a1-5%2f8%22%2cSize%3a10%22+x+15%22%2cSize%3a100%27+x+200%27%2cSize%3a2-7%2f8%22%2cSize%3a6%3e+x+500%3c'\n* The above syntax can be mixed together\n  * e.g. \"size:0ft x 2ft,4294965847,packaging:100 bag,thickness:102mm,4294965836,style:A Slop,color: Beige\"\n"
        schema:
          type: string
      - in: query
        name: showSkuList
        description: if "true", display sku list
        schema:
          type: string
      - in: query
        name: enableAutoCorrection
        description: Default is true, will enable auto correction for `filter`
        schema:
          type: string
      - in: query
        name: enableDidYouMean
        description: Default is true, will enable did you mean features for `filter`
        schema:
          type: string
      - in: query
        name: showFacets
        description: if "false", do not display facets. Default is "true"
        schema:
          type: string
      - in: query
        name: showHoverAttrs
        description: if "true", display Hover attributes
        schema:
          type: string
      - in: query
        name: hoverSearch
        description: if "true", display Hover version of search
        schema:
          type: string
      - in: query
        name: matchMode
        description: "Usage :\n* It can combine with parameter \"cateFilter\" to filter items,only support \"all\" or \"any\".\n* `all`\n  * Default value, returns items that category matches the entire search category term.\n* `any`\n  * Returns items that category matches at least one category in the search category terms, if exist multi categories, separated by '+'.\n"
        schema:
          type: string
      responses:
        '200':
          description: 'successful operation


            If failed, return messageCode, refer to *API Response Message Code*.


            Example


            { "messageCode": "1001", "messages": [{"type":"error", "value":

            "Validation exception", "code":"1001"}], "success":false }

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/itemlistRep'
        '400':
          description: Bad Request, accountId is invalid
        '401':
          description: Unauthorized, the authorization bearer token is invalid
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '419':
          description: Unauthorized, the authorization bearer token is expired
        '500':
          description: Internal exception
      operationId: getItemlist
      x-operation-id-source: derived
    servers:
    - url: https://beaconproplus.com/v2/rest/com/becn
      description: 'Production. Added by API Evangelist; the harvested document carried no servers[]. Source: info.description of this spec: ''[ PROD BASE URL: https://beaconproplus.com/v2/rest/com/becn ]'''
