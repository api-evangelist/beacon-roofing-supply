      - in: query
        name: pageNo
        description: Default page no is 1, the value only take affect when filter by searchBy and searchTerm.
        schema:
          type: string
      - in: query
        name: searchBy
        schema:
          type: string
        description: '

          ##### searchBy enumeration


          * addressBookIds

          * accountNumber

          '
      - in: query
        name: searchTerm
        schema:
          type: string
        description: '

