components:
  schemas:
    deleteUserReq:
      type: object
      properties:
        login:
          type: string
        email:
          type: string
    deleteInternalUserReq:
      type: object
      properties:
        login:
          type: string
    addressBookInfoObj_CU:
      type: object
      properties:
        nickName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        stateValue:
          type: string
        postalCode:
          type: string
        countryValue:
          type: string
        phoneNumber:
          type: string
    currentUserPermissionObj:
      type: object
      properties:
        Place Order:
          type: object
          example:
            true: true
            false: false
            Yes, with Approval: false
        Price:
          type: object
          example:
            true: true
            false: false
    messagesObj:
      type: array
      items:
        type: object
        properties:
          type:
            type: string
          value:
            type: string
          code:
            type: string
    getPermissionTemplateDetail_rep:
      $ref: '#/components/schemas/BCPermissionTemplateObj_getPermissionTemplateDetail'
    createAddressBookRep:
      type: object
      properties:
        messages:
          $ref: '#/components/schemas/messagesObj'
        messageCode:
          type: integer
        success:
          type: boolean
        addressBookId:
          type: string
    deleteMobileDeviceTokenReq:
      type: object
      properties:
        deviceTokens:
          type: array
          items:
            type: string
    accountOSRAndBMInfo_emailInfoObj:
      type: object
      properties:
        fullName:
          type: string
        emailAddess:
          type: string
        phoneNumber:
          type: string
    deleteAddressBookReq:
      type: object
      properties:
        addressBookId:
          type: string
    updateUser_req:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        title:
          type: string
        email:
          type: string
        phone:
          type: string
          pattern: ^\d{10}$
          example: 1234567890
        role:
          type: object
          properties:
            id:
              type: string
        accounts:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              checked:
                type: boolean
        status:
          type: string
        currentTemplate:
          type: string
        permissionTemplate:
          type: object
          properties:
            templateId:
              type: string
        permissionValues:
          type: string
          additionalProperties:
            type: boolean
          example:
            '100001': true
            '100002': true
            '100003': false
    updatePermissionTemplate_req:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        permissionValues:
          type: string
          additionalProperties:
            type: boolean
          example:
            '100001': true
            '100002': true
            '100003': false
    forgotPassword_req:
      type: object
      properties:
        login:
          type: string
    BCUserObj:
