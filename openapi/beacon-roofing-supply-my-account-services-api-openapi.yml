  /user:
    post:
      security:
      - JSESSIONID: []
        DYN_USER_ID: []
        DYN_USER_CONFIRM: []
        siteId: []
      tags:
      - My Account Services
      summary: Get user list
      description: 'This service will list all the users.


        The available values for op field are eq, ne, contains, not_contains,

        start_with, end_with, not_start_with and not_end_with.


        Request sample:


        {

        "orgId":"100001",

        "query":{

        "or": [{

        "op":"eq",

        "property": "email",

        "value": "abc@example.com"

        },

        {

        "op":"end_with",

        "property": "email",

        "value": "@example.com"

        }],

        "and": [{

        "op":"eq",

        "property": "email",

        "value": "abc@example.com"

        },

        {

        "op":"end_with",

        "property": "email",

        "value": "@example.com"

        }],

        "sortBy":"lastModifiedDate",

        "sortType":"desc",

        "pageIndex":1,

        "pageSize":10

        }

        }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user_req'
      responses:
        '200':
          description: 'successful operation


            refer to *API Uniform Format*

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user_rep'
        '401':
          description: Unauthorized, the authorization bearer token is invalid
        '403':
          description: Forbidden, user do not have permission to access this API, only master admin user or admin user has permission to access
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '419':
          description: Unauthorized, the authorization bearer token is expired
        '500':
          description: Internal exception
      operationId: postUser
