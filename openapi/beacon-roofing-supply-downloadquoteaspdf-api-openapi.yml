servers: []
tags:
- name: DownloadQuoteAsPDF
paths:
  /downloadQuoteAsPDF:
    get:
      operationId: V2Controller_downloadQuoteAsPDF
      summary: Downloads quote in PDF
      description: Downloads quote in PDF.
      parameters:
      - name: quoteId
        required: false
        in: path
        description: Quote Id
        schema:
          type: string
      - name: showPrice
        required: false
        in: path
        description: If true, will show price on PDF. If false, will not show price on PDF
        schema:
          type: boolean
      - name: receivedQuote
        required: false
        in: path
        description: 'If true, will return received quotes. If false, will return quotes in draft or in process.  '
        schema:
          type: boolean
      - name: showBackToQuouteDetailPageLink
        required: false
        in: path
        description: If true, will show link to quote detail page on PDF.
        schema:
          type: boolean
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - DownloadQuoteAsPDF
