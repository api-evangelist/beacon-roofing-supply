      - title
      - contactPhoneNumber
      - officePhoneNumber
      - mobilePhoneNumber
      - subscribEmailType
      - contactAddress
      - declineNotificationEmail
      - userAccounts
      - hasPrivateEVAccount
    DeliveryTrackingSettings:
      type: object
