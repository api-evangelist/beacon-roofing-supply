        contactPhoneNumber:
          type: string
        officePhoneNumber:
          type: string
        mobilePhoneNumber:
          type: string
        subscribEmailType:
          $ref: '#/components/schemas/SubscribEmailType'
        contactAddress:
          $ref: '#/components/schemas/ContactAddress'
        declineNotificationEmail:
          type: boolean
        userAccounts:
          type: array
          items:
            type: string
        hasPrivateEVAccount:
