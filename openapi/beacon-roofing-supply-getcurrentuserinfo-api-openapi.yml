  version: '1.0'
  contact: {}
servers: []
tags:
- name: GetCurrentUserInfo
paths:
  /getCurrentUserInfo:
    get:
      operationId: V2Controller_getCurrentUserInfo
      summary: Returns user details
      description: This service returns details for a logged in user. In this response, dtAccount is the deliveryTrackingSettings of current user with last selected account and roleType is one of "Master Admin","Admin", or "Site User".
      parameters: []
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getCurrentUserInfoResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - GetCurrentUserInfo
components:
  schemas:
    LastSelectedAccount:
      type: object
      properties:
        accountName:
          type: string
        accountEnabled:
          type: boolean
        accountLegacyId:
          type: string
        accountViewPrices:
          type: boolean
        addCustomSteel:
          type: boolean
        cashAccount:
          type: boolean
        isAccountClosed:
          type: boolean
      required:
      - accountName
      - accountEnabled
      - accountLegacyId
      - accountViewPrices
      - addCustomSteel
      - cashAccount
      - isAccountClosed
    ContactAddress:
      type: object
      properties:
        email:
          type: string
        lastName:
          type: string
        firstName:
          type: string
        phoneNumber:
          type: string
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
      required:
      - email
      - lastName
      - firstName
      - phoneNumber
      - address1
      - address2
      - city
      - state
      - postalCode
      - country
    getCurrentUserInfoResponse:
      type: object
      properties:
