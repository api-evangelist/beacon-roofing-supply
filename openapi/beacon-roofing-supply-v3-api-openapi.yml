      - facetName
      - recordCount
      - selected
    Category2:
      type: object
      properties:
        categoryName:
          type: string
        categoryId:
          type: string
        recordCount:
          type: number
        facetId:
          type: string
      required:
      - categoryName
      - categoryId
      - recordCount
      - facetId
    Specification:
      type: object
      properties:
        Shingles_Per_Square:
          type: string
        Algae_Resistance:
          type: string
        Coverage_Per_Square:
          type: string
        Bundles_Per_Square:
          type: string
        Nominal_Size:
          type: string
        Net_Free_Vent_Area__NFVA_:
          type: string
        Exposure:
          type: string
        Wind_Resistance:
          type: string
      required:
      - Shingles_Per_Square
      - Algae_Resistance
      - Coverage_Per_Square
      - Bundles_Per_Square
      - Nominal_Size
      - Net_Free_Vent_Area__NFVA_
      - Exposure
      - Wind_Resistance
    DidYouMean:
      type: object
      properties:
        message:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
      required:
      - message
      - items
    Facets:
      type: object
      properties:
        Categories:
          type: array
          items:
            $ref: '#/components/schemas/Category3'
        Color:
          type: array
          items:
            $ref: '#/components/schemas/Child'
        Product Style:
          type: array
          items:
            $ref: '#/components/schemas/Child'
        Brand:
          type: array
          items:
            $ref: '#/components/schemas/Child'
      required:
      - Categories
      - Color
      - Product Style
      - Brand
    Size:
      type: object
      properties:
        12x10:
          type: array
          items:
            type: string
        4x4:
          type: array
          items:
            type: string
      required:
      - 12x10
      - 4x4
    Item:
      type: object
      properties:
        filter:
          type: string
      required:
      - filter
    mincronMappingResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
      required:
      - products
    Color:
      type: object
      properties:
        White:
          type: array
          items:
            type: string
        Dover:
          type: array
          items:
            type: string
      required:
      - White
      - Dover
    Child2:
      type: object
      properties:
        facetId:
          type: string
        facetName:
          type: string
        recordCount:
          type: number
        selected:
          type: boolean
        children:
          type: array
          items:
            $ref: '#/components/schemas/Child'
      required:
      - facetId
      - facetName
      - recordCount
      - selected
      - children
    CurrentSKU:
      type: object
      properties:
        currentUOM:
          type: string
        color:
          type: string
        manufactureNumber:
          type: string
        unitPrice:
          type: number
        itemNumber:
          type: string
        productNumber:
          type: string
        uomlist:
          type: array
          items:
            type: string
        itemImage:
          type: string
        heroImage:
          type: string
        thumbImage:
          type: string
        swatchImage:
          type: string
        skuShortDesc:
          type: string
        auxiliaryImages:
          type: array
          items:
            type: string
      required:
      - currentUOM
      - color
      - manufactureNumber
      - unitPrice
      - itemNumber
      - productNumber
      - uomlist
      - itemImage
      - heroImage
      - thumbImage
      - swatchImage
      - skuShortDesc
      - auxiliaryImages
