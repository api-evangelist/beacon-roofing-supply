tags:
- name: UploadOrderRelatedDocuments
paths:
  /uploadOrderRelatedDocuments:
    post:
      operationId: V2Controller_uploadOrderRelatedDocuments
      summary: Uploads order related documents
      description: Uploads order related documents in .jpg,.pdf, or*.xls(x) format to a quote, saved order or completed order.
      parameters:
      - name: orderId
        required: true
        in: path
        description: The ATG order number, saved order Id, or quote order Id.
        schema:
          type: string
      - name: relatedDocuments
        required: false
        in: path
        description: The document to attach to quote, saved order or completed order. File size should be between 0KB~5MB and file count should between 0-10. Accepted file types include .jpg,.pdf, or*.xls(x).
        schema:
          type: string
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - UploadOrderRelatedDocuments
