  version: '1.0'
  contact: {}
servers: []
tags:
- name: GetOrderApprovalList
paths:
  /getOrderApprovalList:
    post:
      operationId: V2Controller_getOrderApprovalList
      summary: Returns list of all saved or pending orders
      description: 'Returns list of all saved or pending orders.

        If approverId is empty, it will return all saved / pending orders

        If approverId is not empty, it will return "Pending Order by Approver"


        1. sortBy value


        Pending Order: displayName, accountNumber, createdUser, submittedDate


        Saved Order: displayName, accountNumber, lastModifiedDate, status, creationDate, submittedDate


        2. status value


        Pending Order: READY_FOR_APPROVAL


        Saved Order: READY_FOR_SUBMISSION


        Rejected Order: REJECTED_ORDER


        3. searchBy value


        Pending Order: displayName, accountNumber, createdUser.email, submittedDate


        Saved: Order: displayName, accountNumber, creationDate, createdUser.name, createdUser.email,

        lastModifiedDate, lastModifiedUser.name, lastModifiedUser.email, submittedDate, submittedUser.name, submittedUser.email


        4. searchBy "submittedDate" or "creationDate".Format value is ''MM-dd-yyyy''.eg, 07 - 30 - 2019


        5. "sortBy" "searchBy" are not required.But if value is set, response is limited by the given values.'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/getOrderApprovalListBody'
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getOrderApprovalListResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - GetOrderApprovalList
