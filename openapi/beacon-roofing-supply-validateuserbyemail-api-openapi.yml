  version: '1.0'
  contact: {}
servers: []
tags:
- name: ValidateUserByEmail
paths:
  /validateUserByEmail:
    post:
      operationId: V2Controller_validateUserByEmail
      summary: Validates user by email
      description: Validates that user’s email entered during sign up also exists in database.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/validateUserByEmailBody'
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validateUserByEmailResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - ValidateUserByEmail
components:
  schemas:
    UserRegInfo:
      type: object
      properties:
        userRegisterToken:
          type: string
      required:
      - userRegisterToken
    BranchSelection:
      type: object
      properties:
        accountId:
          type: string
        accountName:
          type: string
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
      required:
      - accountId
      - accountName
      - branches
    validateUserByEmailBody:
      type: object
      properties:
        emailAddress:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        zipCode:
          type: string
        phoneNumber:
          type: string
        g-recaptcha-response:
          type: string
      required:
      - emailAddress
      - firstName
      - lastName
      - zipCode
      - phoneNumber
      - g-recaptcha-response
    Address:
      type: object
      properties:
        postalCode:
          type: string
        state:
          type: string
        address1:
          type: string
        address2:
          type: string
        address3:
          type: string
        country:
          type: string
        city:
          type: string
      required:
      - postalCode
      - state
      - address1
      - address2
      - address3
      - country
      - city
    Branch:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        branchNumber:
          type: string
        branchName:
          type: string
        branchPhone:
          type: string
        branchRegionId:
          type: string
        company:
          type: string
        companyName:
          type: string
        division:
          type: string
        divisionName:
          type: string
        market:
          type: string
      required:
      - address
      - branchNumber
      - branchName
      - branchPhone
      - branchRegionId
      - company
      - companyName
      - division
      - divisionName
      - market
    validateUserByEmailResponse:
      type: object
      properties:
        userRegInfo:
          $ref: '#/components/schemas/UserRegInfo'
        showBranchSelection:
          type: boolean
        branchSelection:
          $ref: '#/components/schemas/BranchSelection'
        retryTimesLeft:
          type: number
        needLogin:
          type: boolean
        needRetry:
          type: boolean
        needContactSupport:
          type: boolean
        needGetUserRegisterToken:
          type: boolean
        needInvoice:
          type: boolean
        registerSuccess:
          type: boolean
      required:
      - userRegInfo
      - showBranchSelection
      - branchSelection
      - retryTimesLeft
      - needLogin
      - needRetry
      - needContactSupport
      - needGetUserRegisterToken
      - needInvoice
      - registerSuccess
