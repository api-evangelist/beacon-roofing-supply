  /updateOrderCCBillingAddress:
    post:
      security:
      - JSESSIONID: []
        DYN_USER_ID: []
        DYN_USER_CONFIRM: []
        siteId: []
      tags:
      - Checkout
      summary: Update Order CC Billing Address Info
      description: 'Update order CC billing address information and send a request to the Credit Purchase API.


        FE needs to obtain the token from LVT and pass in Expiration Date.


        Customers can choose/switch which payment method to use to submit their order. The Back-end will verify the credit card information only if the customer selects "payWithCredit": true,

        otherwise the customer does not need to send credit card information.


        ## Examples:

        #### payWithCredit = true

        ```

        {

        "payWithCredit": true, -- required, submitted by credit card

        "cardInfo": {

        "ExpMM": "string", -- required, the month is a positive integer less than 12

        "ExpYY": "string", -- required, the year is 2 digits

        "Type": "string", -- required

        "FullName": "string" -- optional

        },

        "encryptionTokenData": {

        "LowValueToken": "string" -- required, length <= 30

        },

        "addressVerificationData": {

        "AVSZIPCode": "string" -- optional, format is xxxxx or xxxxx-xxxx

        }

        }

        ```

        #### payWithCredit = false

        ```

        {

        "payWithCredit": false -- required, submitted by cash

        }

        ```'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/creditpurchase_req'
      responses:
        '200':
          description: 'successful operation


            refer to *API Uniform Format*

            '
        '401':
          description: Unauthorized, the authorization bearer token is invalid
        '403':
          description: Forbidden, user do not has permission to access this API
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '419':
          description: Unauthorized, the authorization bearer token is expired
        '500':
          description: Internal exception
      operationId: postUpdateOrderCCBillingAddress
      x-operation-id-source: derived
