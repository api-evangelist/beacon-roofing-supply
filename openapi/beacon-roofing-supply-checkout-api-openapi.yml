      - JSESSIONID: []
        DYN_USER_ID: []
        DYN_USER_CONFIRM: []
        siteId: []
      tags:
      - Checkout
      summary: Get current order review info
      description: '1. This service returns the current order review info


        2. Job name and number combination rule:


        1). Job Account Drop Down: the option is selected in drop-down will be filled into job number field when when invoking /submitCurrentOrder endpoint.


        2). Job name text field: the value will be filled into job name field when invoking /submitCurrentOrder endpoint.


        Condition


        Display Rule


        showJobName


        jobNameRequired


        showJobNumber


        jobNumberRequired


        Job Account Drop Down


        Job Name Text Field


        N

        N

        Y

        Y

        Show Job Account Drop Down, option values are retrieved from jobs array in the response payload. It is a required field

        Hide Job Name Text Field


        Y

        Y

        N

        N

        Hide Job Account Drop Down

        Show Job Name Text Field, customer is able to enter job name freely, and it''s required


        Y

        N

        N

        N

        Hide Job Account Drop Down

        Show Job Name Text Field, but it is optional


        Y

        Y

        Y

        N

        Show Job Account Drop Down, but it is optional

        Show Job Name Text Field, and it is required. Customer is able to enter job name freely, or choose an option from job account drop down, but job name text field will be auto filled once job account selected


        Y

        N

        Y

        N

        Show Job Account Drop Down, but it is optional

        Show Job Name Text Field, and it is optional. Customer is able to enter job name freely, or choose an option from job account drop down, but job name text field will be auto filled once job account selected


        ### PONumber and ExtendedPO Rule:

        1. The [shownExtendedPO, extendedPORequired, poRequired] fields can be obtained from ''/jobs'', ''/getCurrentOrderReview''.

        2. If shownExtendedPO is Yes, only the extended PO needs to be displayed, and extendedPORequired is used to verify whether the extended PO is Required.

        3. If shownExtendedPO is NO, only the regular PO needs to be displayed, and poRequired is used to verify whether the regular PO is Required.


        Required


        shownExtendedPO


        extendedPORequired


        poRequired


        Display Rule


        Y

        Y

        /

        Only show Extended PO Text Field, and it is required.


        Y

        N

        /

        Only show Extended PO Text Field, but it is optional.


        N

        /

        Y

        Only show PO Text Field, and it is required.


        N

        /

        N

        Only show PO Text Field, but it is optional.'
      responses:
        '200':
          description: 'successful operation


            refer to *API Uniform Format*

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getCurrentOrderReviewInfo_rep'
        '401':
          description: Unauthorized, the authorization bearer token is invalid
        '403':
