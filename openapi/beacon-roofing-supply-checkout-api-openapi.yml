  /validateOrderByLocation:
    get:
      security:
      - JSESSIONID: []
        DYN_USER_ID: []
        DYN_USER_CONFIRM: []
        siteId: []
      tags:
      - Checkout
      summary: validate order pick up location inventory
      description: 'This service can validate order pick up location inventory.


        Request sample 1: Search with SkuIds and branchId combination


        /v2/rest/com/becn/validateOrderByLocation?skuIds=10001:15,10002:3,10003:1&branchId=181&address=&apiSiteId=


        Request sample 2: Search with orderId and branchId combination


        /v2/rest/com/becn/validateOrderByLocation?orderId=o31435120&branchId=181&address=&apiSiteId=


        Request sample 3: Search with branch''s address and postcode


        /v2/rest/com/becn/validateOrderByLocation?orderId=o31435120&address=14200%20E%20MONCRIEFF%20PLACE&postCode=90230&apiSiteId=&


        OR


        /v2/rest/com/becn/validateOrderByLocation?skuIds=10001:15,10002:3,10003:1&address=14200%20E%20MONCRIEFF%20PLACE&postCode=90230&apiSiteId=&'
      parameters:
      - in: query
        name: orderId
        description: ATG Order ID, or Saved Order ID, or Quote Order ID. Either orderId or skuIds is required.
        schema:
          type: string
      - in: query
        name: skuIds
        description: itemNumber:Quantity. e.g. skIds=10001:15,10002:3,10003:1. Either orderId or skuIds is required.
        schema:
          type: string
      - in: query
        name: branchId
        description: Branch legacy id
        schema:
          type: string
      - in: query
        name: address
        description: Branch address2
        schema:
          type: string
      - in: query
        name: postCode
        description: Branch address postCode
        schema:
          type: string
      responses:
        '200':
          description: 'successful operation


            refer to *API Uniform Format*

            '
          content:
            application/json:
              schema:
                type: string
        '401':
          description: Unauthorized, the authorization bearer token is invalid
        '403':
