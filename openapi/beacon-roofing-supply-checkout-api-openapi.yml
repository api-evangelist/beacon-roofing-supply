  /addOrderShippingInfo:
    post:
      security:
      - JSESSIONID: []
        DYN_USER_ID: []
        DYN_USER_CONFIRM: []
        siteId: []
      tags:
      - Checkout
      summary: Add/Update current order shipping info
      description: 'This service can Add/Update the current order shipping info


        ### deliveryOptionValue enum:

        * SCHEDULED

        * ONHOLD


        ### shippingMethodValue enum:

        * PICK_UP

        * SHIP_TO


        ## Examples:


        ### SCHEDULED, PICK_UP:

        ```

        {

        "deliveryOptionValue":"SCHEDULED",

        "deliveryDate":"08-20-2020",

        "deliveryTime":"13",

        "shippingMethodValue":"PICK_UP",

        "changeShippingAddressLocation":true,

        "shippingAddress":{

        "branchName": "a",

        "address1":"b",

        "city":"c",

        "stateValue":"LA",

        "postalCode": 11111,

        "phoneNumber":1234567890

        },

        "specialInstruction":"a"

        }

        ```


        ### ONHOLD, SHIP_TO, not Save to Address Book in Profile:

        ```

        {

        "deliveryOptionValue":"ONHOLD",

        "shippingMethodValue":"SHIP_TO",

        "shippingAddress":{

        "nickName":"1",

        "firstName":"2",

        "lastName":"3",

        "address1":"4",

        "address2":"5",

        "city":"6",

        "stateValue":"AK",

        "postalCode":11111,

        "countryValue":"8",

        "phoneNumber":1234567890

        },

        "specialInstruction":"a"

        }

        ```


        ### ONHOLD, SHIP_TO, save to Address Book in Profile:

        ```

        {

        "deliveryOptionValue":"onHold",

        "shippingMethodValue":"SHIP_TO",

        "shippingAddress":{

        "addressBookId":"41840007",

        "nickName":"asdasdas",

        "firstName":"2",

        "lastName":"3",

        "address1":"4",

        "address2":"5",

        "city":"6",

        "stateValue":"AK",

        "postalCode":11111,

        "countryValue":"8",

        "phoneNumber":1234567890

        },

        "saveShippingAddressToAddressBook":true,

        "specialInstruction":"a"

        }

        ```'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/addOrderShippingInfo_req'
      responses:
        '200':
          description: 'successful operation


            refer to *API Uniform Format*

