components:
  schemas:
    saveEagleViewOrderBilling_res:
      type: object
      properties:
        success:
          type: boolean
        messages:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              value:
                type: string
        result:
          type: object
          properties:
            billId:
              type: string
    saveEagleViewOrderBilling_req:
      type: object
      properties:
        reportId:
          type: string
          description: report id
        reportDate:
          type: string
          example: yyyy-MM-dd hh:mm:ss
          description: date of report
        reportAddresses:
          type: object
          properties:
            address1:
              type: string
            address2:
              type: string
            zipCode:
              type: string
            city:
              type: string
            state:
              type: string
        cost:
          type: number
          format: double
          description: cost
        status:
          type: string
          description: status
        productType:
          type: string
          description: product type
        source:
          type: string
          description: source from atg/webhook
    getEagleViewOrderReport_resp:
      type: object
      properties:
        ReportId:
          type: integer
          description: Report Id of report.
        Street:
          type: string
          description: Street address of report.
        BuildingId:
          type: string
          description: BuildingId of report.
        City:
          type: string
          description: City of report.
        State:
          type: string
          description: State of report.
        Zip:
          type: string
          description: Zip of report.
        Latitude:
          type: integer
          description: Latitude of report.
        Longitude:
          type: integer
          description: Longitude of report.
        ClaimNumber:
          type: string
          description: Claim number of report.
        ClaimInfo:
          type: string
          description: Claim information of report.
        BatchId:
          type: string
          description: Batch ID of report.
        CatId:
          type: string
          description: Custom catastrophe ID field.
        DatePlaced:
          type: string
          format: date-time
          description: Date and time report was placed.
        DateCompleted:
          type: string
          format: date-time
          description: Date and time report was completed. Null if not completed.
        PONumber:
          type: string
          description: PO number for report.
        Comments:
          type: string
          description: Customer comments from report.
        ReportImage:
          type: array
          description: Customer image data for report.
          items:
            $ref: '#/components/schemas/ReportImage'
        ReferenceId:
          type: string
          description: ReferenceId for report.
        InsuredName:
          type: string
          description: Insured name for report.
        MeasurementRequestType:
          type: integer
          description: "Available MeasurementRequestTypes\n * `1` - PrimaryPlusDetachedGarage\n * `2` - PrimaryStructureOnly\n * `3` - AllStructuresOnParcel\n * `4` - CommercialComplex\n * `5` - Other\n"
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
        ReportDownloadLink:
          type: string
          description: URL to download latest report PDF.
        EligibleForUpgrade:
          type: boolean
          description: Indicates if report can be upgraded from QuickSquares to a Premium Report.
        Status:
          type: string
          description: "Status-SubStatus of Report.\n * Created\n * Created - Customer\n * Created - Processing\n * InProcess\n * InProcess - UnderReview\n * InProcess - ProcessStarted\n * InProcess - ReadyToSend\n * InProcess - AddressVerified\n * InProcess - RTCVerified\n * InProcess - ReadyToCapturePayment\n * InProcess - PendingClosure\n * InProcess - ClosureDenied\n * InProcess - Cancellation\n * Pending\n * Pending - SiteMap\n * Pending - NeedToID\n * Pending - ReportTypeChange\n * Pending - CustomerResponse\n * Pending - CreditCardFailure\n * Pending - MeasurementData\n * Closed\n * Closed - Duplicate\n * Closed - CanceledByClient\n * Closed - PoorImages\n * Closed - NoID\n * Closed - TrainingFile\n * Closed - ReportTypeChange\n * Closed - NoImages\n * Closed - Other\n * Closed - System\n * Closed - CardRejected\n * Closed - WrongHouse\n * Closed - UnsupportedStructure\n * Closed - ImageResolutionRestriction\n * Closed - ImageAgeRestriction\n * Closed - UnableToCollect\n * Completed\n * Completed - CanceledByClient\n * Completed - NotSent\n * Completed - WorkFinished\n * Completed - Submitted\n * Completed - Cancelled\n"
        Area:
          type: string
          description: Total area of report.
        Pitch:
          type: string
          description: Primary pitch of report.
        LengthRidge:
          type: string
          description: Total length of all ridges for report.
        LengthValley:
          type: string
          description: Total length of all valleys for report.
        LengthEave:
          type: string
          description: Total length of all eaves for report.
        LengthRake:
          type: string
          description: Total length of all rakes for report.
        ProductPrimaryId:
          type: integer
          description: ID of the primary product.
        ProductPrimary:
          type: string
          description: Name of the primary product.
        ProductDeliveryId:
          type: integer
          description: ID of the delivery product.
        ProductDelivery:
          type: string
          description: Name of the delivery product.
        AddOnProductIds:
          type: string
          description: Comma-seperated list of any Add-On products.
        AllowsUserSubmittedPhotos:
          type: boolean
          description: Indicates if user submitted photos will appear on report if uploaded by user.
