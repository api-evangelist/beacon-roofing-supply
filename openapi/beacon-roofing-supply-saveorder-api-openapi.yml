openapi: 3.2.0
info:
  title: Beacon Rest Services Save Order API
  description: 'A combination of all methods in the beacon-api


    [ BASE URL: https://beaconproplus.com


    Beacon ProPlus


    Version 1: https://beaconproplus.com/v1/rest/com/becn


    Version 2: https://beaconproplus.com/v2/rest/com/becn


    Version 3: https://beaconproplus.com/v3/rest/com/becn


    Beacon Stack


    [ BASE URL: https://beacon-api-x7xzzdp35a-uk.a.run.app


    Version 1: https://beacon-api-x7xzzdp35a-uk.a.run.app/v1/rest/com/becn/


    Version 2: https://beacon-api-x7xzzdp35a-uk.a.run.app/v2/rest/com/becn/


    Version 3…'
  version: '1.0'
  contact: {}
servers: []
tags:
- name: SaveOrder
paths:
  /saveOrder:
    post:
      operationId: V2Controller_saveOrder
      summary: Creates new saved order and saves cart items to this order
      description: 'Creates new saved order and adds current shopping cart items to the newly created saved order. The following fields in the request body are optional: po (purchase order), jobName, jobNumber, additionalRecipients.'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/saveOrderBody'
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/saveOrderResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - SaveOrder
components:
  schemas:
    saveOrderResponse:
      type: object
      properties:
        successUrl:
          type: string
        savedOrderId:
          type: string
      required:
      - successUrl
      - savedOrderId
    saveOrderBody:
      type: object
      properties:
        savedOrderName:
          type: string
        po:
          type: string
        jobName:
          type: string
        jobNumber:
          type: string
        additionalRecipients:
          type: array
          items:
            type: string
      required:
      - savedOrderName
      - po
      - jobName
      - jobNumber
      - additionalRecipients
