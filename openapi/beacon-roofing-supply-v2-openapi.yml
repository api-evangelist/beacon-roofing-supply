  /pricing:
    get:
      security:
        - JSESSIONID: [ ]
          DYN_USER_ID: [ ]
          DYN_USER_CONFIRM: [ ]
          siteId: [ ]
      tags:
        - Catalog ITEM Services
      summary: Get price and Unit of Measures (UoMs) for multiple line items
      description: |
        Returns price and unit of measure for each line item

        If some of the UoM is empty, will return "EMPTY_UOM" in response

        e.g.

        "priceInfo": {
          {
              "unitPrice": 10.47,
              "itemNumber": "397547",
              "uom": "EMPTY_UOM",
              "available": true
          }
        }
      parameters:
        - in: query
          name: skuIds
          required: true
          schema:
            type: string
          description: >
            SKU ID list long string, seperated by commas


            e.g. "253729,253737,253740"


            If query with UOM(optional), should add UOM after each sku id and
            seperated by colon


            e.g. "253729:BDL,253737,253740:PC"


            If UOM is empty, will get price of all UOMs for this SKU
        - in: query
          name: accountId
          description: Account ID
          schema:
            type: string
        - in: query
          name: jobNumber
          schema:
            type: string
          description: Job Number
      responses:
        '200':
          description: |
            successful operation

            refer to *API Uniform Format*

            Response fields explanation:

            * `priceInfo.<key>`: SKU ID. e.g. `priceInfo["253729"]`
            * `priceInfo.<value>`: SKU UOM and Price pairs. e.g. `priceInfo["253729"] = {"BDL": 125.67, "PC": 10.86}`
            * `priceInfo.<value>.<key>`: SKU UOM. e.g. `priceInfo["253729"]["BDL"]`
            * `priceInfo.<value>.<value>`: SKU Price of this UOM. e.g. `priceInfo["253729"]["BDL"] = 125.67`

            The example below presents:

             * SKU `253729`'s price: `125.67`(with UOM `BDL`) and `10.86`(with UOM `PC`)
             * SKU `253737`'s price: `3663.22`(with UOM `CTN`)
             * SKU `253740`'s price: `2384.34`(with UOM `CTN`) and `834.43`(with UOM `PC`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pricingRep'
        '401':
          description: 'Unauthorized, the authorization bearer token is invalid'
