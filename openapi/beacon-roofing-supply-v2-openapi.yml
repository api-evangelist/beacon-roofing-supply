      summary: Update Order CC Billing Address Info
      description: |
        Update order CC billing address information and send a request to the Credit Purchase API.
        
        FE needs to obtain the token from LVT and pass in Expiration Date.
        
        Customers can choose/switch which payment method to use to submit their order. The Back-end will verify the credit card information only if the customer selects "payWithCredit": true, 
        otherwise the customer does not need to send credit card information.
        
        ## Examples:
        #### payWithCredit = true
        ```
        {
            "payWithCredit": true, -- required, submitted by credit card
            "cardInfo": {
              "ExpMM": "string", -- required, the month is a positive integer less than 12
              "ExpYY": "string", -- required, the year is 2 digits
              "Type": "string",  -- required
              "FullName": "string" -- optional
            },
            "encryptionTokenData": {
              "LowValueToken": "string" -- required, length <= 30
            },
            "addressVerificationData": {
              "AVSZIPCode": "string" -- optional, format is xxxxx or xxxxx-xxxx
            }
        }
        ```
        #### payWithCredit = false
        ```
        {
            "payWithCredit": false -- required, submitted by cash
        }
        ```

      requestBody:
        required: false
