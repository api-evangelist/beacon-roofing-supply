        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusChangeNotification_rep'
        '403':
          description: Unauthorized user or invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusChangeNotification_rep'
        '405':
          description: 'Method not allowed, the request method is not valid for this API or this API is not available.'
        '500':
          description: Internal exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statusChangeNotification_rep'
  /getStatusChange:
    get:
      tags:
        - Delivery Tracking Service
      summary: get delivery status change notification
      description: >

        If query parameter is empty, return profile level status change
        notification;


        `accountId` is optional, if not in the parameter, will return all account mapping items.


        In response


        `dtStatusChangeNotification` presents current user status change
        notification;



        `dtAdminStatusChangeNotification` presents other user status change
        notification with same account of current user;



        `dtAccountStatusChangeNotification` presents current user with account mapping status change
        notification; this is new to configure DT setting per account.If "dtAccountStatusChangeNotification" is empty,
        system will send notification by setting of "dtAdminStatusChangeNotification" or "dtStatusChangeNotification"



        If `orderId` or `orderNumber` or `savedOrderId` is not empty, return
        order level status change notification;



        In response


        `dtOrderStatusChangeNotification` presents current order status change
        notification
      parameters:
        - in: query
          name: orderId
          schema:
            type: string
          description: ATG Order ID
        - in: query
          name: orderNumber
          schema:
            type: string
          description: Order ID
        - in: query
          name: savedOrderId
          schema:
            type: string
          description: Saved Order ID
        - in: query
          name: accountId
          schema:
            type: string
          description: Account Legacy Number
      responses:
        '200':
          description: successful operation
