  /invoiceHistory:
    get:
      security:
        - JSESSIONID: [ ]
          DYN_USER_ID: [ ]
          DYN_USER_CONFIRM: [ ]
          siteId: [ ]
          rememberPassword: [ ]
      tags:
        - Order History Services
      summary: Get invoice history for the given account
      parameters:
        - in: query
          name: apiSiteId
          description: Site Id
          schema:
            type: string
        - in: query
          name: accountId
          description: Account ID
          required: true
          schema:
            type: string
        - in: query
          name: company
          description: Company Number
          required: true
          schema:
            type: string
        - in: query
          name: branchNumber
          description: Branch number
          required: true
          schema:
            type: string
        - in: query
          name: pageSize
          description: Default page size is 25, max 100
          schema:
            type: integer
        - in: query
          name: pageNo
          description: Default page no is 1
          schema:
            type: integer
        - in: query
          name: searchBy
          schema:
            type: string
          description: |
            searchBy enumeration
            * OrderPlacedDate
            * OrderNumber
            * OrderStatus
            * UUID
            * OrderId
        - in: query
          name: searchTerm
          schema:
            type: string
          description: |
            When 'searchBy' is one of the following enumeration, the 'searchTerm' should be populated
            * OrderNumber
            * UUID
            * OrderId
        - in: query
          name: searchStartDate
          schema:
            type: string
            format: MM-DD-YYYY
          description: |
            When 'searchBy' is 'OrderPlacedDate', the 'searchStartDate' should be populated, format should be 'MM-DD-YYYY', e.g. '01-05-2021',the searchStartDate limit  to the past year.
        - in: query
          name: searchEndDate
          schema:
            type: string
            format: MM-DD-YYYY
          description: |
            When 'searchBy' is 'OrderPlacedDate', the 'searchEndDate' should be populated, format should be 'MM-DD-YYYY', e.g. '01-05-2021'
        - in: query
          name: searchEnum
          schema:
            type: string
          description: |
            When 'searchBy' is 'OrderStatus', the 'searchEnum' should be one of the following enumeration:
            * Delivered
            * Invoiced
            * Pending
            * Processing
            * ReadyDeliveryOrPickUp
            * DeliveredOrInvoiced
        - in: query
          name: queryCompany
          description: Default queryCompany is true
          schema:
            type: boolean
      responses:
        '200':
          description: |
            successful operation

            If failed, return messageCode, refer to *API Response Message Code*.

            Example

            { "messageCode": "1001", "messages": [{"type":"error", "value":
            "Validation exception", "code":"1001"}], "success":false }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invoiceHistoryRes'
        '400':
          description: 'Bad Request, the request method is not valid'
        '401':
          description: 'Unauthorized, user do not login'
        '500':
          description: Internal exception
