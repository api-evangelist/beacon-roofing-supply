  /submitOrder:
    post:
      security:
        - JSESSIONID: [ ]
          DYN_USER_ID: [ ]
          DYN_USER_CONFIRM: [ ]
          siteId: [ ]
          rememberPassword: [ ]
      tags:
        - Submit Order Services
      summary: Submit order
      description: >
        This service is used to submit order.

        #### Request Body Validation

        * apiSiteId: String, Required

        * accountId: String, Max Length:6, Required

        * job.jobName: String, Max Length:15

        * job.jobNumber: String, Max Length:7

        * purchaseOrderNo: String, Max Length:22
        
        * extendedPO: String, Max Length:50

        * shipping.shippingMethod: String, Max Length:1

        * shipping.shippingBranch: String, Max Length:4

        * shipping.address.address1: String, Max Length:30

        * shipping.address.address2: String, Max Length:30

        * shipping.address.city: String, Max Length:25

        * shipping.address.postalCode: String, Max Length:10

        * shipping.address.state: String, Max Length:2

        * sellingBranch: String, Max Length:4
        
        * payment.cardInfo.ExpMM: String, The month is a positive integer less than 12, Required
        
        * payment.cardInfo.ExpYY: String, Year is 2 digits, Required
        
        * payment.cardInfo.Type: String, Required
        
        * payment.cardInfo.FullName: String, Optional
        
        * payment.encryptionTokenData.LowValueToken: String, Required
        
        * payment.addressVerificationData.AVSZIPCode: String, format is xxxxx or xxxxx-xxxx, Required

        * specialInstruction: String, Max Length:234

        * lineItems: Required

        * lineItems.itemNumber: String, Max Length:6

        * lineItems.quantity: Integer, Max Length:10, Required

        * lineItems.unitOfMeasure: String, Max Length:3

        * lineItems.description: String, Max Length:128

        * lineItems.lineComments: String, Max Length:2048

        * lineItems.productNumber: String, Max Length:40

        * lineItems.ATGItemMapping.materialID: String, Max Length:40

        * lineItems.ATGItemMapping.branchId: String, Max Length:40

        * lineItems.ATGItemMapping.MFRName: String, Max Length:254

        * lineItems.ATGItemMapping.itemNumber: String, Max Length:40

        * lineItems.ATGItemMapping.integrationName: String, Max Length:254

        * pickupDate: String, Format: yyyy-mm-dd

        * pickupTime: String, Recommended values: ["Morning", "Afternoon",
        "Anytime", "Special Request"]

        * UUID: String, Max Length:100
        
        * attachFile.fileName: String, Max Length:40
        
        * attachFile.fileType: String, Max Length:20
        
        * attachFile.attachEncodeFile: Base64, File Max Size:5MB


        If "checkForAvailability" is "no", will not check availability of
        lineItems, otherwise will do check availability of lineItems
        
        
        "Payment" is optional. If payment is passed in the parameter, payWithCredit defaults to true, and the credit card process is carried out and verified. 
        If payment is not passed in the parameter, the pay with cash process is carried out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/submitOrderReq'
      responses:
        '200':
          description: |
            successful operation

            If failed, return messageCode, refer to *API Response Message Code*.

            Example

            { "messageCode": "1001", "message": "Validation exception" }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/submitOrderRep'
        '401':
          description: 'Unauthorized, user do not login'
        '403':
          description: 'Forbidden, user do not has permission to access this API'
        '405':
          description: 'Method not allowed, the request method is not valid for this API or this API is not available.'
        '500':
          description: Internal exception
