              <th colspan="1" align="center" width="20%"><p><span>Code Group</span></p></th>
              <th align="center" width="10%"><p><span>Code</span></p></th>
              <th align="left" width="40%"><p><span>Comments</span></p></th>
          </tr>
          <tr>
              <td rowspan="8" align="left" width="20%">1XXX: <br>common request param error</td>
              <td align="center" width="10%">1001</td>
              <td align="left" width="40%">Param is required.</td>
          </tr>
          <tr>
              <td align="center" width="10%">1002</td>
              <td align="left" width="40%">Repository item not found via request</td>
          </tr>
          <tr>
              <td align="center" width="10%">1003</td>
              <td align="left" width="40%">Param max length is invalid.</td>
          </tr>
          <tr>
              <td align="center" width="10%">1004</td>
              <td align="left" width="40%">Param min length is invalid.</td>
          </tr>
          <tr>
