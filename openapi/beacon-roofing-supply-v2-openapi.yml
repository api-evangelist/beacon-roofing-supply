paths:
  /hoverExplicitLogin:
    post:
      security:
        - JSESSIONID: [ ]
          DYN_USER_ID: [ ]
          DYN_USER_CONFIRM: [ ]
          siteId: [ ]
      tags:
        - My Account Services
      summary: Hover Explicit Login
      description: |
        This service can do Hover explicit login for user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hoverExplicitLogin_req'
      responses:
        '200':
          description: |
            successful operation

            refer to *API Uniform Format*
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hoverExplicitLogin_rep'
        '401':
          description: 'Unauthorized, the authorization bearer token is invalid'
        '405':
          description: 'Method not allowed, the request method is not valid for this API or this API is not available.'
        '419':
          description: 'Unauthorized, the authorization bearer token is expired'
        '500':
          description: Internal exception
  /getCurrentUserInfo:
