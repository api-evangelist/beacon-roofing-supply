    post:
      security:
        - JSESSIONID: [ ]
          DYN_USER_ID: [ ]
          DYN_USER_CONFIRM: [ ]
          siteId: [ ]
          rememberPassword: [ ]
      tags:
        - Quote Order Services
      summary: Update quote order
      description: >
        This service can update quote order, such as modifying quote order items.

        ## Request body: required

        * id: required, ATG quote order id

        * action: required

        ## items: required

        ### action is 'CREATE_ITEM'

        * itemNumber: required

        * quantity: required

        * uom: optional

        * matchColor: optional, format: "vendor color name(code)", e.g. "Gunmetal
        Grey(010)" or just "vendor color name", e.g. "Gunmetal Grey"

        * matchMFG: optional

        ### Example:
            {
                "id":"27200001",
                "action":"create_item",
                "commerceItems":[
                    {
                        "quantity":11,
                        "itemNumber":"292490",
                        "uom":"AB",
                        "matchColor":"",
                        "matchMFG":""
                    },
                    {
                        "quantity":22,
                        "itemNumber":"292490",
                        "uom":"AB",
                        "matchColor":"",
                        "matchMFG":""
                    },
                    {
                        "quantity":123,
                        "itemNumber":"473295",
                        "uom":"CD",
                        "matchColor":"",
                        "matchMFG":""
                    }
                ]
            }

        ### action is 'UPDATE_ITEM'

        * id: required, ATG quote order item id

        * itemNumber: optional

        * quantity: optional

        * uom: optional

        * matchColor: optional, format: "vendor color name(code)", e.g. "Gunmetal
        Grey(010)" or just "vendor color name", e.g. "Gunmetal Grey"

        * matchMFG: optional

        * for additional item only quantity can be changed

        ### Example:
            {
                "id":"27200001",
                "displayName": "GAF Z-Ridge",
                "action":"update_item",
                "commerceItems":[
                    {
                        "id":600001,
                        "quantity":444,
                        "itemNumber":"292490",
                        "uom":"AB1",
                        "matchColor":"",
                        "matchMFG":""
                    },
                    {
                        "id":600002,
                        "quantity":555,
                        "itemNumber":"473295",
                        "uom":"CD2",
                        "matchColor":"",
                        "matchMFG":""
                    },
                    {
                        "id":600003,
                        "quantity":555
                    }
                ]
            }

        ### action is 'DELETE_ITEM'

        * id: required, ATG quote order item id

        ### Example:
            {
                "id":"27200001",
                "action":"delete_item",
                "commerceItems":[
                    {
                        "id":600001
                    },
                    {
                        "id":600002
                    }
                ]
            }

        other fields not listed above will be ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateQuoteOrder_req'
      responses:
        '200':
          description: |
            successful operation

            refer to *API Uniform Format*
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateQuoteOrder_rep'
        '401':
