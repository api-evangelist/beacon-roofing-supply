      description: >-
        The actions is to update user receive delivery tracking notification

        1. Requested,Scheduled,Enroute,Arrived,Delivered,Cancelled,Missed value
        should be one of "none","email","sms","emailAndsms";


        2.`dtStatusChangeNotification` presents current user status change
                  notification;

        3. `dtAdminStatusChangeNotification` presents other user status change
        notification with same account of current user;



        4. `dtAccountStatusChangeNotification` presents current user with account mapping status change
        notification; this is new to configure DT setting per account.If "dtAccountStatusChangeNotification" is empty,
        system will send notification by setting of "dtAdminStatusChangeNotification" or "dtStatusChangeNotification"

      requestBody:
        content:
          application/json:
