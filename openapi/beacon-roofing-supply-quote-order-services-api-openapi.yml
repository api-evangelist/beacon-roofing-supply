  /submitQuoteOrderForApproval:
    post:
      security:
      - JSESSIONID: []
        DYN_USER_ID: []
        DYN_USER_CONFIRM: []
        siteId: []
      tags:
      - Quote Order Services
      summary: Convert quote order to a saved order and submit saved order for approval
      description: 'This service can convert quote order to a saved order and submit saved order to approver.

        orderId is a required field and it''s quoteOrderId that is generated when quote coverted to order.

        savedOrderName is a required field. ATG will generate save order with it. So, it doesn''t need to invoke saveOrder service to create save order.

        approverId is a required field. Please Retrieve approverList by endpoint "/approver".


        ## Examples:

        ###

        ```

        {

        "orderId":"qo9200001",

        "savedOrderName":"test",

        "approverId":"user41240006",

        "poName": "string",

        "jobName": "string",

        "jobNumber": "string",

        "additionalRecipients": [

        "string"

        ]

        }

        ```'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/submitQuoteOrderForApproval_req'
      responses:
        '200':
          description: 'successful operation


            refer to *API Uniform Format*

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/submitQuoteOrderForApproval_resp'
        '401':
          description: Unauthorized, the authorization bearer token is invalid
        '403':
          description: Forbidden, user do not has permission to access this API
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '419':
          description: Unauthorized, the authorization bearer token is expired
        '500':
          description: Internal exception
      operationId: postSubmitQuoteOrderForApproval
      x-operation-id-source: derived
