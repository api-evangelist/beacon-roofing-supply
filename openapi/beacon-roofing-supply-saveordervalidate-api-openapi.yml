tags:
- name: SaveOrderValidate
paths:
  /saveOrderValidate:
    get:
      operationId: V2Controller_saveOrderValidate
      summary: Validates the saved or pending order
      description: Validates a saved order by saved order Id and returns invalid items, dates, shipping methods or times.
      parameters:
      - name: id
        required: false
        in: path
        description: Saved order Id
        schema:
          type: string
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - SaveOrderValidate
