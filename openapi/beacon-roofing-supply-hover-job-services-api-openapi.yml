tags:
- name: Hover Job Services
paths:
  /getHoverJobList:
    get:
      security:
      - JSESSIONID: []
        DYN_USER_ID: []
        DYN_USER_CONFIRM: []
        siteId: []
      tags:
      - Hover Job Services
      summary: List hover jobs
      description: This service will list the hover jobs
      parameters:
      - in: query
        name: pageSize
        description: Default page size is 1
        schema:
          type: integer
      - in: query
        name: pageNo
        description: Default page no is 20
        schema:
          type: integer
      - in: query
        name: filter
        description: Search filter/terms
        schema:
          type: string
      - in: query
        name: orderBy
        description: 'Default is ''updated_at asc''

          ### orderBy enumeration

          * created_at asc/desc

          * updated_at asc/desc

          '
        schema:
          type: string
      responses:
        '200':
          description: 'successful operation


            refer to *API Uniform Format*

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getHoverJobList_rep'
        '401':
          description: Unauthorized, the authorization bearer token is invalid
        '403':
          description: Forbidden, user do not has permission to access this API
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '419':
          description: Unauthorized, the authorization bearer token is expired
        '500':
          description: Internal exception
      operationId: getGetHoverJobList
      x-operation-id-source: derived
  /getHoverJobListImage:
    get:
      security:
      - JSESSIONID: []
        DYN_USER_ID: []
        DYN_USER_CONFIRM: []
        siteId: []
      tags:
      - Hover Job Services
      summary: Get hover job image
      description: This service will return the hover job image
      parameters:
