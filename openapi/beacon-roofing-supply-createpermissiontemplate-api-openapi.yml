servers: []
tags:
- name: CreatePermissionTemplate
paths:
  /createPermissionTemplate:
    post:
      operationId: V2Controller_createPermissionTemplate
      summary: Creates permissions template
      description: Creates permissions templates with custom permissions to assign to new user accounts.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createPermissionTemplateBody'
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createPermissionTemplateResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - CreatePermissionTemplate
components:
  schemas:
    createPermissionTemplateBody:
      type: object
      properties:
        name:
          type: string
        permissionValues:
          $ref: '#/components/schemas/PermissionValues'
      required:
      - name
      - permissionValues
    PermissionValues:
      type: object
      properties:
        aa:
          type: boolean
        bb:
          type: boolean
        cc:
          type: boolean
      required:
      - aa
      - bb
      - cc
    createPermissionTemplateResponse:
      type: object
      properties:
        templateId:
          type: string
      required:
      - templateId
