openapi: 3.2.0
info:
  title: Beacon Rest Services Submit Rebate API
  description: 'A combination of all methods in the beacon-api


    [ BASE URL: https://beaconproplus.com


    Beacon ProPlus


    Version 1: https://beaconproplus.com/v1/rest/com/becn


    Version 2: https://beaconproplus.com/v2/rest/com/becn


    Version 3: https://beaconproplus.com/v3/rest/com/becn


    Beacon Stack


    [ BASE URL: https://beacon-api-x7xzzdp35a-uk.a.run.app


    Version 1: https://beacon-api-x7xzzdp35a-uk.a.run.app/v1/rest/com/becn/


    Version 2: https://beacon-api-x7xzzdp35a-uk.a.run.app/v2/rest/com/becn/


    Version 3…'
  version: '1.0'
  contact: {}
servers: []
tags:
- name: SubmitRebate
paths:
  /submitRebate:
    post:
      operationId: V2Controller_submitRebate
      summary: Submits rebate request
      description: Submits rebate request according to getRebateForm api.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/submiteRebateBody'
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - SubmitRebate
components:
  schemas:
    RebateInfo:
      type: object
      properties:
        companyName:
          type: string
        contactName:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
      required:
      - companyName
      - contactName
      - phoneNumber
      - email
    submiteRebateBody:
      type: object
      properties:
        rebateId:
          type: string
        rebateInfo:
          $ref: '#/components/schemas/RebateInfo'
        rebateAddress:
          $ref: '#/components/schemas/RebateAddress'
        rebateCustomInfo:
          $ref: '#/components/schemas/RebateCustomInfo'
        rebateMailingAddress:
          $ref: '#/components/schemas/RebateCustomInfo'
      required:
      - rebateId
      - rebateInfo
      - rebateAddress
      - rebateCustomInfo
      - rebateMailingAddress
    RebateAddress:
      type: object
      properties:
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
      required:
      - address
      - city
      - state
      - zip
    RebateCustomInfo:
      type: object
      properties: {}
