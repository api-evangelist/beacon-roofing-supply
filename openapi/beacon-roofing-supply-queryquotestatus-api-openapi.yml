servers: []
tags:
- name: QueryQuoteStatus
paths:
  /queryQuoteStatus:
    post:
      operationId: V2Controller_queryQuoteStatus
      summary: Returns quote status
      description: Returns status of quote in Mincron including "expires", "quoteNotesEditable", "rejectEnable", "reviseEnable", "copyOrderEnable", "approveEnable", "finalizeOrderEnable".
      parameters:
      - name: quoteId
        required: true
        in: path
        description: Mincron quote Id
        schema:
          type: string
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/queryQuoteStatusResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - QueryQuoteStatus
components:
  schemas:
    Message:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
        code:
          type: string
      required:
      - type
      - value
      - code
    Result:
      type: object
      properties:
        pageRows:
          type: number
        pages:
          type: number
        page:
          type: number
        rows:
          type: number
        rowsPerPage:
          type: number
      required:
      - pageRows
      - pages
      - page
      - rows
      - rowsPerPage
    queryQuoteStatusResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        success:
          type: boolean
        result:
          $ref: '#/components/schemas/Result'
      required:
      - messages
      - success
      - result
