  /reviseQuote:
    post:
      security:
      - JSESSIONID: []
        DYN_USER_ID: []
        DYN_USER_CONFIRM: []
        siteId: []
      tags:
      - Quote Services
      summary: Revise quote
      description: 'This service can revise quote.


        1. Quote ID invalid or empty: will show error message.


        2. Quote ID valid: able to revise the Quote. and store will send out

        email.


        3. Quote status != ready for review, will show error message.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/reviseQuote_req'
      responses:
        '200':
          description: 'successful operation


            refer to *API Uniform Format*

            '
        '401':
          description: Unauthorized, the authorization bearer token is invalid
        '403':
          description: Forbidden, user do not has permission to access this API
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '419':
          description: Unauthorized, the authorization bearer token is expired
        '500':
          description: Internal exception
      operationId: postReviseQuote
      x-operation-id-source: derived
  /rejectQuote:
    post:
      security:
      - JSESSIONID: []
        DYN_USER_ID: []
        DYN_USER_CONFIRM: []
        siteId: []
      tags:
      - Quote Services
      summary: Reject quote
      description: 'This service can reject quote.


        1. Quote ID invalid or empty: will show error message.


        2. Quote ID valid: able to revise the Quote. and store will send out

        email.


        3. Quote status != ready for review, will show error message.


        4. The reason value should be one of ''Price is Too High'', ''Lost Bid'', ''Product Not Available'', ''Product Will Arrive Late'' and ''Other''.


        5. The additionalReason only works when the reject reason is ''Other'''
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/rejectQuote_req'
      responses:
        '200':
          description: 'successful operation


            refer to *API Uniform Format*

            '
        '401':
