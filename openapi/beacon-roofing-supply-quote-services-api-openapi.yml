  /submitQuote:
    post:
      security:
      - JSESSIONID: []
        DYN_USER_ID: []
        DYN_USER_CONFIRM: []
        siteId: []
      tags:
      - Quote Services
      summary: Submit quote
      description: 'This service can submit quote for current user.


        There two situations as below:


        1. quoteId is null: will create quote at first, then submit quote, if failed, rollback


        2. quoteId is not null: will query quote by quoteId, if quote exists then submit quote.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/submitQuote_req'
      responses:
        '200':
          description: 'successful operation


            If failed, return messageCode, refer to *API Response Message Code*.


            Example


            { "messageCode": "1001", "messages": [{"type":"error", "value":

            "Validation exception", "code":"1001"}], "success":false }

