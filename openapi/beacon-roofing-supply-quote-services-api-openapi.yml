openapi: 3.2.0
info:
  title: Beacon Rest Services Ver 2 (OAuth) Quote Services API
  version: 24PI-4-Sprint-3
  description: This version uses OAuth authorization method to access API services.
servers:
- url: https://beaconproplus.com/v2/rest/com/becn
  description: 'Production. Added by API Evangelist; the harvested document carried no servers[]. Source: info.description of this spec: ''[ PROD BASE URL: https://beaconproplus.com/v2/rest/com/becn ]'''
tags:
- name: Quote Services
paths:
  /quote:
    get:
      tags:
      - Quote Services
      summary: List all quotes for the current user
      description: This service is able to list all quotes for the current user
      parameters:
      - in: query
        name: account
        required: true
        schema:
          type: string
        description: Account ID
      - in: query
        name: quoteType
        description: 'The quote type you want to query, if empty, will return all types of quote


          #### quoteType enumeration

          * draft

          * inProcess

          * received

          '
        schema:
          type: string
      - in: query
        name: pageSize
        schema:
          type: string
        description: Default is 10, max is 100, record count of each page
      - in: query
        name: pageNo
        schema:
          type: string
        description: Default is 1, the first page, page number or page index
      - in: query
        name: filterBy
        description: 'The search key


          #### filterBy enumeration

          * quoteId

          * quoteName

          * creationDate

          * status

          * jobName

          '
        schema:
          type: string
      - in: query
        name: filter
        description: 'The search terms


          When filterBy is ''status'', filter should be one of enumeration below


          #### filter status enumeration

          * Open

          * InProgress

          * Revised

          * Ready for Review

          * Approved

          * Ordered

          * Closed

          '
        schema:
          type: string
      - in: query
        name: jobName
        schema:
          type: string
      - in: query
        name: orderBy
        description: 'Default is ''creationDate desc''


          #### orderBy enumeration

          * quoteId asc/desc

          * quoteName asc/desc

          * creationDate asc/desc

          * status asc/desc

          * createdBy asc/desc

          '
        schema:
          type: string
      responses:
        '200':
          description: 'successful operation


            If failed, return messageCode, refer to *API Response Message Code*.

            Example


            { "messageCode": "1001", "messages": [{"type":"error", "value": "Validation exception", "code":"1001"}], "success":false }

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/quote_rep'
        '401':
          description: Unauthorized, the authorization bearer token is invalid
        '403':
          description: Forbidden, user do not has permission to access this API
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '419':
          description: Unauthorized, the authorization bearer token is expired
        '500':
          description: Internal exception
      operationId: getQuote
      x-operation-id-source: derived
  /getMincronQuoteDetail:
    post:
      tags:
      - Quote Services
      summary: Get quote details for a given template
      description: This service provides quotes details for a given quote Id.
      parameters:
