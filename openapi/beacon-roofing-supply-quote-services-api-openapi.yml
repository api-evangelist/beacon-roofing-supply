      summary: Submit Delegated quote
      description: 'This service can submit quote for delegated accountId on behalf of current user.


        There two situations as below:


        1. quoteId is null: will create quote at first, then submit quote, if failed, rollback


        2. quoteId is not null: will query quote by quoteId, if quote exists then submit quote.'
      requestBody:
        required: true
