  /approveQuote:
    post:
      security:
      - JSESSIONID: []
        DYN_USER_ID: []
        DYN_USER_CONFIRM: []
        siteId: []
      tags:
      - Quote Services
      summary: Approve quote
      description: 'This service can approve quote.


        1. Quote ID invalid


        2. Quote ID empty, shows quote ID is required.


        3. Quote ID valid, able to approve the quote, and webstore will send out

        email.


        4. Quote Status != ready for review, System will show message'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/approveQuote_req'
      responses:
        '200':
          description: 'successful operation


            refer to *API Uniform Format*

            '
        '401':
          description: Unauthorized, the authorization bearer token is invalid
        '403':
          description: Forbidden, user do not has permission to access this API
        '405':
