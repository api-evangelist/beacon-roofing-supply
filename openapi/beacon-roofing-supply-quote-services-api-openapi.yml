      x-operation-id-source: derived
  /updateQuote:
    post:
      security:
      - JSESSIONID: []
        DYN_USER_ID: []
        DYN_USER_CONFIRM: []
        siteId: []
      tags:
      - Quote Services
      summary: Update quote
      description: 'This service can update quote and modifying quote items.

        ### items:

        * action:

        * UPDATE_QUOTE

        * CREATE_ITEM

        * UPDATE_ITEM

        * DELETE_ITEM


        UPDATE_QUOTE example:


        {

        "id":"29600002",

        "quoteName":"test quote",

        "phoneNumber":"12345678901",

        "address1":"test address1",

        "address2":"test address2",

        "city":"test city",

        "state":"Alabama",

        "jobNumber":"RSGD",

        "jobName":"ECONE APARTMENT",

        "workType":"R",

        "quoteNotes":"test quote notes",

        "mailingAddress1": "test mailing address1",

        "mailingAddress2": "test mailing address2",

        "mailingAddress3": "test mailing address3",

        "mailingState": "Alabama",

        "mailingCity": "test mailing city 001",

        "mailingZip": "90207",

        "expires": "test expires",

        "action":"UPDATE_QUOTE"

        }


        CREATE_ITEM example:


        {

        "id":"28400006",

        "quoteItems":[

        {

        "itemNumber":"412023",

        "itemType":"I",

        "uom":"CTN",

        "quantity":22,

        "displayName":"test display name"

        },

        {

        "itemNumber":"368238",

        "itemType":"E",

        "uom":"CTN",

        "quantity":22,

        "displayName":"test display name",

        "matchColor": "red",

        "dimensions": "dd"

        }

        ],

        "action":"CREATE_ITEM"

        }


        UPDATE_ITEM example:


        {

        "id":"29600002",

        "quoteName":"jason test quote",

        "quoteItems":[{

        "id":"36300005",

        "quantity":3

        }],

        "action":"UPDATE_ITEM"


        DELETE_ITEM example:


        {

        "id":"29600002",

        "deleteItems":[

        "36300005"

        ],

        "action":"DELETE_ITEM"

        }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateQuote_req'
      responses:
        '200':
          description: 'successful operation


            refer to *API Uniform Format*

            '
        '401':
          description: Unauthorized, the authorization bearer token is invalid
        '403':
          description: Forbidden, user do not has permission to access this API
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '419':
          description: Unauthorized, the authorization bearer token is expired
        '500':
          description: Internal exception
      operationId: postUpdateQuote
      x-operation-id-source: derived
  /deleteQuote:
    post:
      security:
      - JSESSIONID: []
        DYN_USER_ID: []
        DYN_USER_CONFIRM: []
        siteId: []
      tags:
      - Quote Services
      summary: Delete quote
      description: 'This service can delete quote(s) for current user.


        ### Request body: required


