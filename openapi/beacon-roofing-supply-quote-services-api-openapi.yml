      x-operation-id-source: derived
  /downloadQuoteAsPDF:
    get:
      security:
      - JSESSIONID: []
        DYN_USER_ID: []
        DYN_USER_CONFIRM: []
        siteId: []
      tags:
      - Quote Services
      summary: Download quote as PDF
      description: This service can download quote as PDF.
      parameters:
      - in: query
        name: quoteId
        required: true
        schema:
          type: string
        description: Quote ID
      - in: query
        name: showPrice
        schema:
          type: boolean
        description: show price on download PDF or not
      - in: query
        name: receivedQuote
        schema:
          type: boolean
        description: received quote or not ,defualt true, for draft and inProcess quote pass it value to false.
      - in: query
        name: showBackToQuouteDetailPageLink
        schema:
          type: boolean
        description: show back to quote detail page link on download PDF or not
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: byte
          description: 'successful operation


            return the PDF file in bytes


            Failed operation


            return ''application/json'' and refer to *API Uniform Format*

            '
        '401':
          description: Unauthorized, the authorization bearer token is invalid
        '403':
          description: Forbidden, user do not has permission to access this API
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '419':
          description: Unauthorized, the authorization bearer token is expired
        '500':
          description: Internal exception
      operationId: getDownloadQuoteAsPDF
      x-operation-id-source: derived
