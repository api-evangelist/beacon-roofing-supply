openapi: 3.2.0
info:
  title: Beacon Rest Services Submit Quote Order For Approval API
  description: 'A combination of all methods in the beacon-api


    [ BASE URL: https://beaconproplus.com


    Beacon ProPlus


    Version 1: https://beaconproplus.com/v1/rest/com/becn


    Version 2: https://beaconproplus.com/v2/rest/com/becn


    Version 3: https://beaconproplus.com/v3/rest/com/becn


    Beacon Stack


    [ BASE URL: https://beacon-api-x7xzzdp35a-uk.a.run.app


    Version 1: https://beacon-api-x7xzzdp35a-uk.a.run.app/v1/rest/com/becn/


    Version 2: https://beacon-api-x7xzzdp35a-uk.a.run.app/v2/rest/com/becn/


    Version 3…'
  version: '1.0'
  contact: {}
servers: []
tags:
- name: SubmitQuoteOrderForApproval
paths:
  /submitQuoteOrderForApproval:
    post:
      operationId: V2Controller_submitQuoteOrderForApproval
      summary: Converts quote order to a saved order and sends saved order for approval
      description: 'Converts quote order to a saved order and sends saved order to approver for accounts that require approval for orders. quoteOrderId is converted to the orderId when quote is converted to an order. ATG will create a saved order once sent. approverId can be retrieved from approverList with endpoint "/approver".


        orderId, savedOrderName, and approverId are required fields.'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/submitQuoteOrderForApprovalBody'
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/submitQuoteOrderForApprovalResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - SubmitQuoteOrderForApproval
components:
  schemas:
    submitQuoteOrderForApprovalBody:
      type: object
      properties:
        orderId:
          type: string
        savedOrderName:
          type: string
        approverId:
          type: string
        poName:
          type: string
        jobName:
          type: string
        jobNumber:
          type: string
        additionalRecipients:
          type: array
          items:
            type: string
      required:
      - orderId
      - savedOrderName
      - approverId
      - poName
      - jobName
      - jobNumber
      - additionalRecipients
    submitQuoteOrderForApprovalResponse:
      type: object
      properties:
        savedOrderId:
          type: string
      required:
      - savedOrderId
