            JRNINSTANCE:
              type: string
            JRNJOURNALTYPE:
              type: string
            JRNPURPOSE:
              type: string
            JRNREVERSALDATE:
              type: string
            PREPARERID:
              type: string
            JRNACCOUNTINGPERIOD:
              type: string
              format: date
            JOURNALURL:
              type: string
            JRNJOURNALREFERENCECODE:
              type: string
            JOURNAL_HEADER:
              type: string
        item:
          type: array
          items:
            type: object
            properties:
              JRNLLINENUMBER:
                type: string
              JRNLCOMPANY:
                type: string
              JRNLBRANCH:
                type: string
              JRNLDEPARTMENT:
                type: string
