        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception
      operationId: postCreateJournal (Deprecated)
      x-operation-id-source: derived
  /validateCAJournal (Deprecated):
    post:
      security:
      - internalAuth: []
      tags:
      - Journal Services
      summary: submit validation journal service to mincron service
      requestBody:
        required: true
        content:
          application/json:
            schema:
