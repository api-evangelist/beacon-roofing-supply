        '400':
          description: Bad Request.
        '401':
          description: Unauthorized, the authorization token is invalid
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception
      operationId: postValidateCAJournal (Deprecated)
      x-operation-id-source: derived
  /createCAJournal (Deprecated):
    post:
      security:
      - internalAuth: []
      tags:
      - Journal Services
      summary: create journal data to mincron service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/journalCreateReq'
      responses:
        '200':
          description: 'successful operation


            refer to *API Uniform Format*

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/journalResp'
        '400':
          description: Bad Request.
        '401':
          description: Unauthorized, the authorization token is invalid
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception
      operationId: postCreateCAJournal (Deprecated)
      x-operation-id-source: derived
  /operateJournal:
    post:
      security:
      - internalAuth: []
      tags:
      - Journal Services
      summary: journal operation to mincron service
      description: 'request journal header value:

        - journal_created: create journal to US endpoint

        - journal_created_CA: create journal to CA endpoint

        - journal_validation: validation journal to US endpoint

        - journal_validation_CA: validation journal to CA endpoint'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/journalReq'
      responses:
        '200':
          description: 'successful operation


            refer to *API Uniform Format*

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/journalResp'
        '400':
          description: Bad Request.
        '401':
          description: Unauthorized, the authorization token is invalid
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception
      operationId: postOperateJournal
      x-operation-id-source: derived
