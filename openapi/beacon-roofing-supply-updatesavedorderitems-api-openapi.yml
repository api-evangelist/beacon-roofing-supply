  version: '1.0'
  contact: {}
servers: []
tags:
- name: UpdateSavedOrderItems
paths:
  /updateSavedOrderItems:
    post:
      operationId: V2Controller_updateSavedOrderItems
      summary: Updates saved or pending order items
      description: Adds multiple items to a cart. "items.color" should be either "vendor color name(code)" or "vendor color name".
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateSavedOrderItemsBody'
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateSavedOrderItemsResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - UpdateSavedOrderItems
components:
  schemas:
    Items:
      type: object
      properties:
        id:
          type: string
        imageUrl:
          type: string
        imageOnErrorUrl:
          type: string
        thumbImageUrl:
          type: string
        pdpUrl:
          type: string
        description:
          type: string
        itemNumber:
          type: string
        price:
          type: number
        quantity:
          type: number
        uom:
          type: string
        subTotal:
          type: number
        deleteStatus:
          type: boolean
        vendorColorId:
          type: string
        productId:
          type: string
        itemGrayOutLevel:
          type: string
      required:
      - id
      - imageUrl
      - imageOnErrorUrl
      - thumbImageUrl
      - pdpUrl
      - description
      - itemNumber
      - price
      - quantity
      - uom
      - subTotal
      - deleteStatus
      - vendorColorId
      - productId
      - itemGrayOutLevel
    updateSavedOrderItemsBody:
      type: object
      properties:
        savedOrderId:
          type: string
        savedOrderName:
          type: string
        action:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
      required:
      - savedOrderId
      - savedOrderName
      - action
      - items
    Item:
      type: object
      properties:
        filter:
          type: string
      required:
      - filter
    updateSavedOrderItemsResponse:
      type: object
      properties:
        savedOrderId:
          type: string
        savedOrderName:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Items'
      required:
      - savedOrderId
      - savedOrderName
      - items
