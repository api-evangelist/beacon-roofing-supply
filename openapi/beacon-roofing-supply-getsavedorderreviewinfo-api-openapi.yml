tags:
- name: GetSavedOrderReviewInfo
paths:
  /getSavedOrderReviewInfo:
    post:
      operationId: V2Controller_getSavedOrderReviewInfo
      summary: Returns saved or pending order review information
      description: Returns saved or pending order review information for given saved order Id
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/getSavedOrderReviewInfoBody'
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getSavedOrderReviewInfoResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - GetSavedOrderReviewInfo
