openapi: 3.2.0
info:
  title: EagleView Eagle View Measurement API
  description: EagleView Restful API
  version: V1.0.0
servers:
- url: https://beaconproplus.com
  description: Generated server url
tags:
- name: EagleViewMeasurement
paths:
  /v1/eagleview/doMeasurementCalculation:
    post:
      tags:
      - EagleViewMeasurement
      summary: Get recommend quantity by measurement data
      description: Get recommended quantity based on measurement data
      operationId: doMeasurementCalculation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasurementCalculationReq'
        required: true
      responses:
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '500':
          description: Internal exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '400':
          description: Bad Request, accountId is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '403':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementCalculationRes'
        '401':
          description: Unauthorized, user do not login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
  /v1/eagleview/OrderStatusUpdate:
    get:
      tags:
      - EagleViewMeasurement
      summary: Get recommend quantity by measurement data
      description: Get recommended quantity based on measurement data
      operationId: updateOrderStatus
      parameters:
      - name: ReportId
        in: query
        required: true
        schema:
          type: integer
          format: int32
      - name: SubStatusId
        in: query
        required: true
        schema:
          type: integer
          format: int32
      - name: RefId
        in: query
        required: true
        schema:
          type: string
      - name: StatusId
        in: query
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '500':
          description: Internal exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '400':
          description: Bad Request, accountId is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '403':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementCalculationRes'
        '401':
          description: Unauthorized, user do not login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
components:
  schemas:
    MeasurementCalculationRespItem:
      type: object
      properties:
        success:
          type: boolean
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        recommendQuantity:
          type: integer
          format: int64
        calculatedQuantity:
          type: string
        wasteFactor:
          type: string
        dividend:
          type: string
        divisor:
          type: string
        skuNumber:
          type: string
        productId:
          type: string
    MeasurementCalculationReqItem:
      required:
      - productId
      - skuNumber
      type: object
      properties:
        productId:
          type: string
        skuNumber:
          type: string
        wasteFactor:
          type: string
          description: 0-100 / two-decimal is available
        location:
          type: string
          description: It's required for category "Starter Shingles", only can be "Eaves", "Rakes" and "both".
        inputOverlap:
          type: string
          description: The category "Underlayment" need overlap.
        inputSubtractRidge:
          type: string
          description: customer must choose subtracting ridges or using entire length before VENTILATION 3D+ calculation.
      description: List of measurement calculation request items
    ServiceResult:
      type: object
      properties:
        message:
          type: string
        code:
          type: integer
          format: int32
        success:
          type: boolean
    MeasurementCalculationReq:
      required:
      - items
      - report
      type: object
      properties:
        items:
          maxItems: 2147483647
          minItems: 1
          type: array
          description: List of measurement calculation request items
          items:
            $ref: '#/components/schemas/MeasurementCalculationReqItem'
        report:
          $ref: '#/components/schemas/EVOrderReport'
        baseWasteFactor:
          type: string
          description: 0-100 / two-decimal is available
    EVOrderReport:
      type: object
      properties:
        rootArea:
          type: number
          format: double
        lengthEave:
          type: string
        lengthRake:
          type: string
        lengthRidge:
          type: string
        lengthHip:
          type: string
    MeasurementCalculationRes:
      type: object
      properties:
        success:
          type: boolean
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        measurementCalculationRespItems:
          type: array
          items:
            $ref: '#/components/schemas/MeasurementCalculationRespItem'
    Message:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
        code:
          type: integer
          format: int32
