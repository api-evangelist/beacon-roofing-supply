      x-operation-id-source: derived
  /getNewUserTour:
    get:
      security:
      - JSESSIONID: []
        DYN_USER_ID: []
        DYN_USER_CONFIRM: []
        siteId: []
        rememberPassword: []
      tags:
      - User Tour Services
      summary: get user tour
      responses:
