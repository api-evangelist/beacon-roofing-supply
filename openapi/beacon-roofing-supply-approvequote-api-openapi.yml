  version: '1.0'
  contact: {}
servers: []
tags:
- name: ApproveQuote
paths:
  /approveQuote:
    post:
      operationId: V2Controller_approveQuote
      summary: Approves quote
      description: Approves quote for accounts with approval enabled. If quote Id is invalid, empty or quote status is not in ready for review status, will result in an error message. If quote Id is valid and quote status is ready for review, quote will be approved and email notification will be sent to quote submitter.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/approveQuoteBody'
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - ApproveQuote
components:
  schemas:
    approveQuoteBody:
      type: object
      properties:
        quoteId:
          type: string
      required:
      - quoteId
