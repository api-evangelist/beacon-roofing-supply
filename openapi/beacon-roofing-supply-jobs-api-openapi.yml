  version: '1.0'
  contact: {}
servers: []
tags:
- name: Jobs
paths:
  /jobs:
    get:
      operationId: V1Controller_jobs
      summary: Lists available job names for an account
      description: Returns available job names and job numbers for an account.
      parameters:
      - name: accountId
        required: true
        in: path
        description: Account Id
        schema:
          type: string
      responses:
        '200':
          description: 'successful operation<br><br>If failed, return messageCode, refer to the <i>API Response Message Code</i> dropdown above<br><br>Example:<br><br>{ "messageCode": "1001", "messages": [{ "type": "error", "value": "Validation exception", "code": "1001" }], "success": false }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobsResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - Jobs
components:
  schemas:
    Job:
      type: object
      properties:
        jobName:
          type: string
        jobNumber:
          type: string
      required:
      - jobName
      - jobNumber
    jobsResponse:
      type: object
      properties:
        message:
          type: string
        hasJobAccount:
          type: boolean
        hasJobNumber:
          type: boolean
        isJobAccountRequired:
          type: boolean
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
      required:
      - message
      - hasJobAccount
      - hasJobNumber
      - isJobAccountRequired
      - jobs
