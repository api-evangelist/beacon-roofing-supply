  version: '1.0'
  contact: {}
servers: []
tags:
- name: ProceedToCheckout
paths:
  /proceedToCheckout:
    post:
      operationId: V2Controller_proceedToCheckout
      summary: Proceeds to check out page
      description: This service returns the checkout page URL to progress page from shopping cart to checkout page. If item in the current shopping cart is invalid, response will return error message.
      parameters: []
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/proceedToCheckoutResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - ProceedToCheckout
components:
  schemas:
    proceedToCheckoutResponse:
      type: object
      properties:
        nextUrl:
          type: string
      required:
      - nextUrl
