servers: []
tags:
- name: CreateUser
paths:
  /createUser:
    post:
      operationId: V2Controller_createUser
      summary: Creates a new user account
      description: 'Creates a new user account and assigns user permissions. Admin or Master Admin can use user templates to specify role permissions. If default role template is used, the user will receive default role permissions. If user role needs customized permissions, the “permissionValues” will is required to assign custom roles.


        currentTemplate enumeration


        "Default Role Template"


        "Customized Permission"


        any other string value


        When currentTemplate is "Default Role Template", will use the default role permission as user permission values


        When currentTemplate is "Customized Permission", the permissionValues field is required, and will use given "permissionValues" as user permission values


        When currentTemplate is any other string value, the permissionTemplate.templateId field is required, and will use the permissions of given permission template as user permission values


        status enumeration


        "Active"


        "InActive"'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createUserBody'
      responses:
        '200':
          description: successful operation<br><br>refer to the <i>API Uniform Format</i> dropdown above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createUserResponse'
        '400':
          description: Bad Request, accountId is invalid.
        '401':
          description: Unauthorized, the authorization bearer token is invalid.
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception.
      tags:
      - CreateUser
