tags:
- name: User Register Services
paths:
  /getUserRegisterToken:
    get:
      tags:
      - User Register Services
      summary: Get token for user register
      description: This service can return the token for user register
      responses:
        '200':
          description: 'successful operation


            refer to *API Uniform Format*

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegisterResponse_getUserRegisterToken'
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception
      operationId: getGetUserRegisterToken
      x-operation-id-source: derived
  /validateUserByEmail:
    post:
      tags:
      - User Register Services
      summary: Validate user by email
      description: This service can validate the user info by email
      parameters:
      - in: header
        name: X-User-Register-Token
        schema:
          type: string
        required: true
        description: The token from the response of endpoint '/getUserRegisterToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateUserRegRequest_validateUserByEmail'
      responses:
        '200':
          description: 'successful operation


            refer to *API Uniform Format*

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegisterResponse_validateUserByEmail'
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception
      operationId: postValidateUserByEmail
      x-operation-id-source: derived
  /validateUserByAccount:
    post:
      tags:
      - User Register Services
      summary: Validate user by account
      description: This service can validate the user info by account
      parameters:
      - in: header
        name: X-User-Register-Token
        schema:
          type: string
        required: true
        description: The token from the response of endpoint '/getUserRegisterToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateUserRegRequest_validateUserByAccount'
      responses:
        '200':
          description: 'successful operation


            refer to *API Uniform Format*

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegisterResponse_validateUserByAccount'
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception
      operationId: postValidateUserByAccount
      x-operation-id-source: derived
  /register:
    post:
      tags:
      - User Register Services
      summary: Register user
      description: This service can register user
      parameters:
      - in: header
        name: X-User-Register-Token
        schema:
          type: string
        required: true
        description: The token from the response of endpoint '/getUserRegisterToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegInfo'
      responses:
        '200':
          description: 'successful operation


            refer to *API Uniform Format*

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegisterResponse_register'
        '405':
          description: Method not allowed, the request method is not valid for this API or this API is not available.
        '500':
          description: Internal exception
      operationId: postRegister
      x-operation-id-source: derived
