          example: '2018-05-02T13:49:39.85'
    branchAddressObj:
      type: object
      properties:
        postalCode:
          type: string
        state:
          type: string
        address1:
          type: string
        address2:
          type: string
        address3:
          type: string
        city:
          type: string
    DTStatusObj:
      type: object
      properties:
        displayName:
          type: string
        contKey:
          type: string
        contValue:
          type: string
        statusEndDate:
          type: string
          example: 05/05/2018
        infos:
          type: array
          items:
            type: object
            properties:
              defaultValue:
                type: string
              imageUrl:
                type: string
              active:
                type: boolean
              key:
                type: string
              value:
                type: string
    orderHistoryLineItemObj:
      type: object
      properties:
        description:
          type: string
        productOrItemNumber:
          type: string
        subTotal:
          type: number
          format: double
        subTotalNull:
          type: boolean
        itemOrProductDescription:
          type: string
        unitPrice:
          type: number
          format: double
        unitPriceNull:
          type: boolean
        quantity:
          type: integer
        itemNumber:
          type: string
        unitOfMeasure:
          type: string
        unitOfMeasureDisplay:
          type: string
        productImageUrl:
          type: string
        productOnErrorImageUrl:
          type: string
        productId:
          type: string
        pdpUrl:
          type: string
        skuPDPDisplayTitle:
          type: string
        displayQuantityMsg:
          type: boolean
        quantityMsg:
          type: string
        productOrItemDescription:
          type: string
        extendedDescription:
          type: string
        lineComments:
          type: string
        isAddedToFavorites:
          type: boolean
    BCOtherPaginationObj:
      type: object
      properties:
        available:
          type: boolean
        label:
          type: string
        page:
          type: integer
  securitySchemes:
    JSESSIONID:
      type: apiKey
      in: cookie
      name: JSESSIONID
    DYN_USER_ID:
      type: apiKey
      in: cookie
      name: DYN_USER_ID
    DYN_USER_CONFIRM:
      type: apiKey
      in: cookie
      name: DYN_USER_CONFIRM
    siteId:
      type: apiKey
      in: cookie
      name: siteId
    rememberPassword:
      type: apiKey
      in: cookie
      name: siteId
